 // Smooth Catmull-Rom closed spline generator for Skyway Curves (T8)
 function generateCurvedPath(ctrlPts, samplesPerSeg = 6) {
 const pts = [];
 const n = ctrlPts.length;
 for (let i = 0; i < n; i++) {
 const p0 = ctrlPts[(i - 1 + n) % n];
 const p1 = ctrlPts[i];
 const p2 = ctrlPts[(i + 1) % n];
 const p3 = ctrlPts[(i + 2) % n];
 for (let s = 0; s < samplesPerSeg; s++) {
 const t = s / samplesPerSeg;
 const t2 = t * t;
 const t3 = t2 * t;
 const x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3);
 const y = 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3);
 pts.push({ x: Math.max(2, Math.min(cols - 3, x)), y: Math.max(2, Math.min(rows - 3, y)) });
 }
 }
 return pts;
 }

 function initSkyClouds() {

 skyCloudsUpper = [];

 });
 }

 skyCloudsUpper.push({
 x: Math.random() * cols,
 y: Math.random() * rows,
 scale: 1.1 + Math.random() * 1.3,
 speed: 0.018 + Math.random() * 0.018,
 alpha: 0.22 + Math.random() * 0.16
 });
 }
 }

 function buildActiveTrackMap() {
 const cfg = TRACK_CONFIGS[currentTrackId];
 lapWaypoints = cfg.waypoints;
 for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) map[r][c] = 0;
 const roadCandidateSet = new Set();

 segmentDistances = [];
 cumulativeSegmentDist = [0];
 totalLapLength = 0;

 for (let i = 0; i < lapWaypoints.length; i++) {
 const p1 = lapWaypoints[i];
 const p2 = lapWaypoints[(i + 1) % lapWaypoints.length];
 const segLen = Math.hypot(p2.x - p1.x, p2.y - p1.y);
 segmentDistances.push(segLen);
 totalLapLength += segLen;
 cumulativeSegmentDist.push(totalLapLength);

 const steps = Math.max(1, Math.ceil(segLen * 2));
 for (let s = 0; s <= steps; s++) {
 const t = s / steps;
 const cx = Math.round(p1.x + (p2.x - p1.x) * t);
 const cy = Math.round(p1.y + (p2.y - p1.y) * t);
 if (cy >= 0 && cy < rows && cx >= 0 && cx < cols) {
 map[cy][cx] = 1;
 if (!(Math.abs(cy - cfg.startRow) <= 1 && cx >= cfg.startCol - 2) && cx < cols - 2) {
 roadCandidateSet.add(`${cx},${cy}`);
 }
 }
 }
 }

 if (cfg.crossStreets) {
 cfg.crossStreets.forEach(cs => {
 const minX = Math.min(cs.x1, cs.x2), maxX = Math.max(cs.x1, cs.x2);
 const minY = Math.min(cs.y1, cs.y2), maxY = Math.max(cs.y1, cs.y2);
 for (let r = minY; r <= maxY; r++) {
 for (let c = minX; c <= maxX; c++) {
 if (r >= 0 && r < rows && c >= 0 && c < cols && map[r][c] === 0) map[r][c] = 1;
 }
 }
 });
 }

 map[cfg.startRow][cfg.startCol] = 4;

 if (!cfg.isSkyBridge && !cfg.isSkywayCurves) {
 const isNextToRoad = (r, c) => (
 (r > 0 && (map[r-1][c] === 1 || map[r-1][c] === 4)) ||
 (r < rows - 1 && (map[r+1][c] === 1 || map[r+1][c] === 4)) ||
 (c > 0 && (map[r][c-1] === 1 || map[r][c-1] === 4)) ||
 (c < cols - 1 && (map[r][c+1] === 1 || map[r][c+1] === 4))
 );
 for (let r = 0; r < rows; r++) {
 for (let c = 0; c < cols; c++) {
 if (map[r][c] === 0) {
 if (r === 0 || r === rows - 1 || c === 0 || c === cols - 1) {
 if ((r + c) % 2 === 0) map[r][c] = 3;
 } else if (isNextToRoad(r, c) && Math.random() < cfg.buildingChance) {
 map[r][c] = 2;
 } else if (Math.random() < cfg.treeChance) {
 map[r][c] = 3;
 }
 }
 }
 }
 } else {
 initSkyClouds();
 }

 if (cfg.isSkywayCurves) {
 hazardRoadCandidates = lapWaypoints
 .filter((wp, idx) => idx > 4 && idx < lapWaypoints.length - 3)
 .map(wp => ({ x: wp.x, y: wp.y }));
 } else {
 hazardRoadCandidates = Array.from(roadCandidateSet).map(coord => {
 const [x, y] = coord.split(',').map(Number);
 return { x, y };
 });
 }

 emojiMap = Array.from({ length: rows }, () => Array(cols).fill(null));
 if (!cfg.isSkyBridge && !cfg.isSkywayCurves) {
 for (let r = 0; r < rows; r++) {
 for (let c = 0; c < cols; c++) {
 if (map[r][c] === 3) {
 if (cfg.isSnow) emojiMap[r][c] = Math.random() < 0.14 ? "⛄" : "🌲";
 else if (cfg.isVolcano) emojiMap[r][c] = ["🌋","🔥","🪨","🏜️","🌵"][Math.floor(Math.random()*5)];
 else if (cfg.isMountainCliff) emojiMap[r][c] = ["⛰️","🏔️","🗻","🍂","🍁","🌳"][Math.floor(Math.random()*6)];
 else emojiMap[r][c] = EMOJIS.tree[Math.floor(Math.random() * EMOJIS.tree.length)];
 } else if (map[r][c] === 2) {
 let pool = cfg.isVolcano ? ["🌋", "🪨", "🏚️", "⛽"] : ["🏢", "🏦", "🏪"];
 if (!cfg.isVolcano) {
 if (r < rows * 0.45 && c < cols * 0.45) pool = ["🏫", "🏥", "🏤", "🏪"];
 else if (r > rows * 0.7 || c > cols * 0.85) pool = ["🏭", "🏢", "🏪"];
 }
 const neighbors = new Set([
 r > 0 ? emojiMap[r-1][c] : null,
 c > 0 ? emojiMap[r][c-1] : null,
 (r > 0 && c > 0) ? emojiMap[r-1][c-1] : null,
 (r > 0 && c < cols - 1) ? emojiMap[r-1][c+1] : null
 ]);
 const filtered = pool.filter(b => !neighbors.has(b));
 const choices = filtered.length ? filtered : EMOJIS.building.filter(b => !neighbors.has(b));
 const finalPool = choices.length ? choices : pool;
 emojiMap[r][c] = finalPool[Math.floor(Math.random() * finalPool.length)];
 }
 }
 }
 }

 activeTrafficLights = cfg.isSkyBridge ? [] : cfg.trafficLights.map(wpIdx => {
 const node = lapWaypoints[wpIdx];
 return { wpIdx: wpIdx, x: node ? node.x : 0, y: node ? node.y : 0, state: 'green', timer: Math.random() * 6000 + 4000 };
 }).filter(l => l.x !== 0);
 }

 function computeRacerExactScore(racer) {
 if (racer.eliminated) return -10000 - racer.id;
 if (racer.finishRank > 0) return 1000000 - (racer.finishRank * 1000);
 const prevWpIdx = (racer.waypointIndex - 1 + lapWaypoints.length) % lapWaypoints.length;
 const prevNode = lapWaypoints[prevWpIdx];
 const segLen = segmentDistances[prevWpIdx] || 1;
 const distFromPrev = Math.min(segLen, Math.hypot(racer.tileX - (prevNode.x + 0.5), racer.tileY - (prevNode.y + 0.5)));
 const distanceAlongCurrentLap = cumulativeSegmentDist[prevWpIdx] + distFromPrev;
 return (racer.laps * totalLapLength) + distanceAlongCurrentLap;
 }

 function getSortedRacers() {
 return [...racers].sort((a, b) => computeRacerExactScore(b) - computeRacerExactScore(a));
 }

 // --- 5. COMMENTARY ENGINE ---
 let ttsQueue = [];

 function loadVoices() {
 if (!('speechSynthesis' in window)) return;
 const voices = window.speechSynthesis.getVoices();
 if (!voices.length) return;
 emmaVoice = voices.find(v => /microsoft.*aria.*online.*natural|microsoft.*aria|aria.*multilingual|aria/i.test(v.name) && /^en/i.test(v.lang)) ||
 voices.find(v => /multilingual.*online.*natural|online.*natural/i.test(v.name) && /^en/i.test(v.lang)) ||
 voices.find(v => /^en/i.test(v.lang) && /female|zira|jenny|susan|aria|hazel/i.test(v.name)) ||
 voices.find(v => /^en/i.test(v.lang)) || voices[0];
 andrewVoice = voices.find(v => /microsoft.*andrew.*online.*natural|microsoft.*andrew|andrew.*multilingual|andrew|microsoft.*steffan|microsoft.*guy/i.test(v.name) && /^en/i.test(v.lang)) ||
 voices.find(v => /multilingual.*online.*natural|online.*natural/i.test(v.name) && /^en/i.test(v.lang) && v !== emmaVoice) ||
 voices.find(v => /^en/i.test(v.lang) && /male|boy|david|mark|guy|ryan|brian/i.test(v.name)) ||
 voices.find(v => /^en/i.test(v.lang) && v !== emmaVoice) || voices[0];
 }

 if ('speechSynthesis' in window) {
 loadVoices();
 window.speechSynthesis.onvoiceschanged = loadVoices;
 }

 function speakCommentary(speaker, text, interrupt = false) {
 if (!('speechSynthesis' in window)) return;
 const synth = window.speechSynthesis;
 loadVoices();
 if (interrupt) { synth.cancel(); ttsQueue = []; }
 if (synth.speaking || synth.pending) { if (!interrupt) { ttsQueue.push({ speaker, text }); return; } }
 const utter = new SpeechSynthesisUtterance(text);
 utter.volume = 1.0; utter.rate = 1.0; utter.pitch = speaker === 'Emma' ? 1.12 : 1.02; utter.lang = 'en-US';
 const preferredVoice = speaker === 'Emma' ? emmaVoice : andrewVoice;
 if (preferredVoice) { utter.voice = preferredVoice; if (/^en/i.test(preferredVoice.lang)) utter.lang = preferredVoice.lang; }
 utter.onstart = () => {
 lastSpeechStartTime = performance.now();
 setMusicAndHornsDucked(true);
 commentaryBanner.classList.remove('hidden');
 commentaryText.textContent = `${speaker}: "${text}"`;
 };
 utter.onend = () => {
 lastSpeechEndTime = performance.now();
 setMusicAndHornsDucked(false);
 commentaryBanner.classList.add('hidden');
 if (ttsQueue.length > 0) { const next = ttsQueue.shift(); setTimeout(() => speakCommentary(next.speaker, next.text, false), 80); }
 };
 utter.onerror = utter.onend;
 try { synth.resume(); } catch (e) {}
 synth.speak(utter);
 }

 function queueUrgentEventAnnouncement(text) {
 urgentAnnouncementQueue.push(text);
 if (urgentAnnouncementQueue.length > 3) urgentAnnouncementQueue.shift();
 }

 function processLiveCommentary(sortedRacers) {
 if (!('speechSynthesis' in window) || sortedRacers.length === 0) return;
 const now = performance.now();
 if (window.speechSynthesis.speaking) { if (now - lastSpeechStartTime > 7500) window.speechSynthesis.cancel(); else return; }
 const first = sortedRacers[0]; const second = sortedRacers[1]; const third = sortedRacers[2];
 const v1 = VEHICLE_NAMES[first.emoji] || 'car';
 const v2 = second ? (VEHICLE_NAMES[second.emoji] || 'car') : '';
 const v3 = third ? (VEHICLE_NAMES[third.emoji] || 'car') : '';
 const oldFirst = prevTopThreeNames[0];
 const oldSecond = prevTopThreeNames[1];
 const firstChanged = oldFirst !== "" && first.name !== oldFirst;
 const secondChanged = second && oldSecond !== "" && second.name !== oldSecond;

 if (urgentAnnouncementQueue.length > 0 && !lastCommentaryWasUrgent && (now - lastSpeechEndTime > 160)) {
 const speaker = commentatorTurn % 2 === 0 ? 'Emma' : 'Andrew';
 commentatorTurn++; lastCommentaryWasUrgent = true;
 speakCommentary(speaker, urgentAnnouncementQueue.shift(), false);
 return;
 }
 if (now - lastSpeechEndTime < (firstChanged ? 80 : 180)) return;
 lastCommentaryWasUrgent = false;
 prevTopThreeNames = [first ? first.name : "", second ? second.name : "", third ? third.name : ""];
 const speaker = commentatorTurn % 2 === 0 ? 'Emma' : 'Andrew';
 commentatorTurn++; commentaryStyleIndex++;

 let line = "";
 const final20s = (typeof remainingTimeMs !== "undefined" && remainingTimeMs <= 20000);
 const neckAndNeck = second && Math.abs(computeRacerExactScore(first) - computeRacerExactScore(second)) < 2.2;

 if (finishLinePhase) {
 line = `Final sprint to the checkered flag! ${first.name} in the ${v1} leads the charge, with ${second ? second.name + ' in the ' + v2 : 'the pack'} right behind!`;
 } else if (second && third && (final20s || neckAndNeck) && !firstChanged) {
 line = `NECK AND NECK FOR FIRST! ${first.name} in the ${v1} and ${second.name} in the ${v2} are side by side heading into the turn, while ${third.name} closes in fast!`;
 } else if (second && third) {
 if (firstChanged) {
 line = `New leader! ${first.name} surges into first place in the ${v1}, passing ${oldFirst}! ${second.name} is second in the ${v2}, and ${third.name} is third in the ${v3}!`;
 } else if (secondChanged) {
 line = `Big move for second! While ${first.name} leads in the ${v1}, ${second.name} in the ${v2} just passed ${oldSecond} for second!`;
 } else {
 line = `Leaderboard check on lap ${first.laps + 1}: ${first.name} leads in the ${v1}, ${second.name} chases in second in the ${v2}, and ${third.name} holds third in the ${v3}!`;
 }
 } else if (second) {
 line = `${first.name} leads in first in the ${v1}, with ${second.name} chasing in second in the ${v2}!`;
 } else {
 line = `${first.name} is in first place in the ${v1}!`;
 }
 speakCommentary(speaker, line, false);
 }

 function canEliminateNow() {
 if (!gameRunning || finishLinePhase || !raceDurationMs) return false;
 const elapsedRatio = 1 - (remainingTimeMs / raceDurationMs);
 if (elapsedRatio < (1 / 3) || elapsedRatio > (2 / 3)) return false;
 const minSurvivors = Math.max(8, Math.ceil(racers.length / 3));
 const aliveCount = racers.filter(r => !r.eliminated && r.finishRank === 0).length;
 return aliveCount > minSurvivors;
 }

 function triggerSkyFall(racer, nextLeaderName, now) {
 if (!canEliminateNow()) return;
 racer.eliminated = true;
 racer.isFalling = true;
 racer.fallStart = now;
 racer.fallEnd = now + 1500;
 racer.fallStartX = racer.tileX;
 racer.fallStartY = racer.tileY;
 const pushX = (Math.random() < 0.5 ? -1 : 1) * (1.1 + Math.random() * 0.6);
 const pushY = 2.6 + Math.random() * 1.4;
 racer.fallVx = pushX;
 racer.fallVy = pushY;
 racer.crashedUntil = now + 999999;

 playCrashSound();
 shakeUntil = now + 260;

 const vName = VEHICLE_NAMES[racer.emoji] || "car";
 hazardBannerIcon.textContent = "☁️💨";
 hazardBannerText.textContent = `SHARP TURN DROP! ${racer.name} flew off the Sky Bridge!`;
 hazardBanner.classList.remove("hidden");

 const leadText = nextLeaderName ? ` ${nextLeaderName} takes over first place!` : "";

 ];
 queueUrgentEventAnnouncement(lines[Math.floor(Math.random() * lines.length)]);

 });

 if (!isSkyBridge && !finishLinePhase && now > nextPileupTime) {
 nextPileupTime = now + 13000 + Math.random() * 7000;
 triggerPileupEvent();
 }

 activeIcePatches = activeIcePatches.filter(ip => now < ip.until);
 activeEmergencies = activeEmergencies.filter(em => now < em.until);
 activeEmergencies.forEach(em => {
 em.ambX += (em.fireX - em.ambX) * 0.035; em.ambY += (em.fireY - em.ambY) * 0.035;
 em.heliX += (em.fireX - em.heliX) * 0.045; em.heliY += (em.fireY - 0.6 - em.heliY) * 0.045;
 });

 racers.forEach(racer => {
 if (racer.eliminated) return;
 if (now < racer.crashedUntil) return;
 if (racer.finishRank > 0) return;

 if (!isSkyBridge) {
 const hitObsIdx = activeRocks.findIndex(obs => Math.hypot(racer.tileX - obs.tileX, racer.tileY - obs.tileY) < 0.85);
 if (hitObsIdx !== -1) {
 const obs = activeRocks[hitObsIdx];
 if (Math.random() < 0.45) {
 racer.laneOffset = racer.laneOffset > 0 ? -0.35 : 0.35;
 } else {
 activeRocks.splice(hitObsIdx, 1);
 const vName = VEHICLE_NAMES[racer.emoji] || "car";
 spawnLayeredExplosion(obs.tileX, obs.tileY, now, true);
 hazardBannerIcon.textContent = `${obs.emoji}💥`;
 hazardBannerText.textContent = `BLAST! ${racer.name} ${obs.verb}!`;
 hazardBanner.classList.remove("hidden");
 const blastLines = [
 `BOOM! ${racer.name} in the ${vName} just ${obs.verb}! What a massive shockwave!`,
 `WATCH OUT! ${racer.name} ${obs.verb} and sent fiery debris flying across the track!`,
 `INCREDIBLE BLAST! ${racer.name} triggered a ${obs.name} explosion right on the asphalt!`
 ];
 queueUrgentEventAnnouncement(blastLines[Math.floor(Math.random() * blastLines.length)]);

 if (canEliminateNow() && Math.random() < 0.38) {
 const runnerUp = sortedByProgress.find(r => !r.eliminated && r.finishRank === 0 && r.id !== racer.id);
 racer.eliminated = true;
 racer.crashedUntil = now + 999999;
 racer.crashStart = now;
 racer.wreckAngle = (Math.random() < 0.5 ? -1 : 1) * 0.55;
 if (runnerUp) queueUrgentEventAnnouncement(`${racer.name} is OUT after that ${obs.name} blast—${runnerUp.name} moves up!`);
 } else {
 racer.crashedUntil = now + 1500;
 racer.crashStart = now;
 racer.wreckAngle = (Math.random() < 0.5 ? -1 : 1) * 0.45;
 }
 return;
 }
 }

 const hitIceIdx = activeIcePatches.findIndex(ip => Math.hypot(racer.tileX - ip.tileX, racer.tileY - ip.tileY) < 0.85);
 if (hitIceIdx !== -1) {
 activeIcePatches.splice(hitIceIdx, 1); racer.crashedUntil = now + 1100; racer.crashStart = now; racer.wreckAngle = (Math.random() < 0.5 ? -1 : 1) * 0.5;
 return;
 }
 const blockingAnimal = activeAnimals.find(a => Math.hypot(racer.tileX - a.tileX, racer.tileY - a.tileY) < 1.1);
 if (blockingAnimal) { racer.stoppedByAnimal = true; return; } else racer.stoppedByAnimal = false;
 }

 const hitBoostIdx = activeBoosts.findIndex(b => Math.hypot(racer.tileX - b.tileX, racer.tileY - b.tileY) < 0.78);
 if (hitBoostIdx !== -1) {
 activeBoosts.splice(hitBoostIdx, 1);
 racer.boostUntil = now + 3800;
 if (soundInitialized) { try { boostSynth.triggerAttackRelease('8n', Tone.now()); } catch (e) {} }
 const vName = VEHICLE_NAMES[racer.emoji] || 'car';
 queueUrgentEventAnnouncement(`${racer.name} hit a lightning boost in the ${vName}!`);
 }

 if (racer.targetLaneOffset === undefined) racer.targetLaneOffset = racer.laneOffset;
 const aheadRacer = racers.find(other =>
 other.id !== racer.id && !other.eliminated && other.finishRank === 0 &&
 Math.abs(other.laneOffset - racer.laneOffset) < 0.22 &&
 Math.hypot(other.tileX - racer.tileX, other.tileY - racer.tileY) < 1.25 &&
 computeRacerExactScore(other) > computeRacerExactScore(racer)
 );
 if (aheadRacer && (!racer.lastPassCheck || now - racer.lastPassCheck > 650)) {
 racer.lastPassCheck = now;
 const lanes = [-0.36, -0.18, 0, 0.18, 0.36];
 const openLane = lanes.find(l => Math.abs(l - aheadRacer.laneOffset) >= 0.22) ?? (racer.laneOffset > 0 ? -0.34 : 0.34);
 racer.targetLaneOffset = openLane;
 racer.passBoostUntil = now + 900;
 }
 racer.laneOffset += (racer.targetLaneOffset - racer.laneOffset) * 0.12;

 const targetNode = lapWaypoints[racer.waypointIndex];
 const targetTileX = targetNode.x + 0.5 + racer.laneOffset;
 const targetTileY = targetNode.y + 0.5 + racer.laneOffset;

 if (!isSkyBridge) {
 const upcomingLight = activeTrafficLights.find(l => l.wpIdx === racer.waypointIndex);
 if (upcomingLight && upcomingLight.state === 'red') {
 const distToInter = Math.hypot(targetTileX - racer.tileX, targetTileY - racer.tileY);
 if (distToInter < 1.5 && distToInter > 0.4) {
 const rankIndex = sortedByProgress.findIndex(r => r.id === racer.id);
 if (rankIndex > 0 || Math.random() < 0.5) { racer.isStoppedAtLight = true; return; }
 }
 }
 }
 racer.isStoppedAtLight = false;

 if (now > racer.speedChangeTimer) {
 const rankIndex = sortedByProgress.findIndex(r => r.id === racer.id);
 const myScore = computeRacerExactScore(racer);
 const gapBehindLeader = Math.max(0, leadScore - myScore);
 const isFinal20 = (typeof remainingTimeMs !== "undefined" && remainingTimeMs <= 20000) || finishLinePhase;
 let chaosMultiplier = 0.92 + Math.random() * 0.48;
 if (rankIndex === 0) {
 const secondRacer = sortedByProgress[1];
 const leadMargin = secondRacer ? Math.max(0, myScore - computeRacerExactScore(secondRacer)) : 0;
 chaosMultiplier = leadMargin > (isFinal20 ? 0.35 : 0.65) ? (0.76 + Math.random() * 0.18) : (0.90 + Math.random() * 0.26);
 } else if (rankIndex <= 2) {
 chaosMultiplier = 1.08 + (isFinal20 ? 0.24 : 0.14) + Math.random() * 0.32 + Math.min(0.45, gapBehindLeader * 0.06);
 } else {
 chaosMultiplier = 1.12 + Math.random() * 0.48 + Math.min(0.42, gapBehindLeader * 0.03);
 }
 racer.speed = racer.baseSpeed * chaosMultiplier;
 racer.speedChangeTimer = now + 700 + Math.random() * 800;
 }

 let finalSpeed = racer.speed;
 if (now < racer.boostUntil) finalSpeed *= 2.9;
 if (racer.passBoostUntil && now < racer.passBoostUntil) finalSpeed *= 1.15;
 if (finishLinePhase) finalSpeed *= 1.35;

 const dx = targetTileX - racer.tileX;
 const dy = targetTileY - racer.tileY;
 const distTiles = Math.hypot(dx, dy);
 const slowFactor = (now < slowMoUntil) ? 0.35 : 1.0;
 const stepTiles = (finalSpeed * simulationSpeed * slowFactor) / 31;

 racer.headingAngle = Math.atan2(dy, dx);
 if (Math.abs(dx) > Math.abs(dy)) { racer.facingRight = dx > 0; racer.tiltAngle = 0; }
 else { racer.facingRight = false; racer.tiltAngle = dy > 0 ? -0.42 : 0.42; }

 if (distTiles <= stepTiles) {
 const reachedWaypoint = racer.waypointIndex;
 racer.tileX = targetTileX; racer.tileY = targetTileY;
 racer.waypointIndex = (racer.waypointIndex + 1) % lapWaypoints.length;
 if (reachedWaypoint === 0) {
 racer.laps++;
 playLapSound();
 if (finishLinePhase && racer.finishRank === 0) {
 podiumLocked.push(racer);
 racer.finishRank = podiumLocked.length;
 if (podiumLocked.length >= Math.min(3, racers.length)) { endGame(true); return; }
 }
 }
 } else {
 racer.tileX += (dx / distTiles) * stepTiles;
 racer.tileY += (dy / distTiles) * stepTiles;
 }
 });

 if (now - lastPanelRenderTime > 160) {
 lastPanelRenderTime = now;
 const currentSorted = getSortedRacers();
 if (gameRunning && currentSorted.length > 0 && now - raceStartTime > 1000) processLiveCommentary(currentSorted);
 renderLeftPanelDOM(currentSorted, now);
 }
 }

 function renderLeftPanelDOM(sortedList, now = performance.now()) {

 function drawCloudPuff(cx, cy, scale, alpha) {
 ctx.save();
 ctx.globalAlpha = alpha;
 ctx.fillStyle = "#ffffff";
 const r = TILE_SIZE * 0.65 * scale;
 ctx.beginPath();
 ctx.arc(cx, cy, r, 0, Math.PI * 2);
 ctx.arc(cx + r * 0.85, cy - r * 0.15, r * 0.8, 0, Math.PI * 2);
 ctx.arc(cx - r * 0.85, cy + r * 0.1, r * 0.72, 0, Math.PI * 2);
 ctx.arc(cx + r * 0.2, cy - r * 0.55, r * 0.7, 0, Math.PI * 2);
 ctx.fill();
 ctx.restore();
 }

 function drawCratersAndEffects(now) {
 // Ground Craters
 activeCraters.forEach(c => {
 const age = now - c.createdAt;
 const fade = Math.max(0, Math.min(1, (c.until - now) / 4000));
 const cx = c.x * TILE_SIZE;
 const cy = c.y * TILE_SIZE;
 const rad = c.r * TILE_SIZE;
 ctx.save();
 ctx.globalAlpha = 0.85 * fade;
 const grad = ctx.createRadialGradient(cx, cy, rad * 0.1, cx, cy, rad);
 grad.addColorStop(0, "#09090b");
 grad.addColorStop(0.55, "#27272a");
 grad.addColorStop(1, "rgba(24, 24, 27, 0)");
 ctx.fillStyle = grad;
 ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.fill();
 ctx.strokeStyle = "rgba(0,0,0,0.75)";
 ctx.lineWidth = 1.5;
 for (let k = 0; k < 5; k++) {
 const a = c.seed + (k * Math.PI * 2) / 5;
 ctx.beginPath();
 ctx.moveTo(cx, cy);
 ctx.lineTo(cx + Math.cos(a) * rad * 0.9, cy + Math.sin(a) * rad * 0.9);
 ctx.stroke();
 }
 ctx.restore();
 });

 // Layered Explosion Effects: Fireball Core -> Shockwave Rings -> Debris -> Smoke
 activeEffects.forEach(ef => {
 const dur = Math.max(1, ef.until - ef.createdAt);
 const prog = Math.max(0, Math.min(1, (now - ef.createdAt) / dur));
 const ex = ef.x * TILE_SIZE;
 const ey = ef.y * TILE_SIZE;

 if (ef.type === "fireballCore") {
 const r = ef.maxR * TILE_SIZE * (0.35 + prog * 0.85);
 ctx.save();
 ctx.globalAlpha = Math.max(0, 1 - prog * prog);
 const grad = ctx.createRadialGradient(ex, ey, 0, ex, ey, r);
 grad.addColorStop(0, "#ffffff");
 grad.addColorStop(0.3, "#fde047");
 grad.addColorStop(0.65, "#f97316");
 grad.addColorStop(1, "rgba(239, 68, 68, 0)");
 ctx.fillStyle = grad;
 ctx.beginPath(); ctx.arc(ex, ey, r, 0, Math.PI * 2); ctx.fill();
 ctx.restore();
 } else if (ef.type === "shockwave") {
 const r = (0.2 + prog * ef.maxR) * TILE_SIZE;
 ctx.save();
 ctx.globalAlpha = Math.max(0, (1 - prog) * 0.9);
 ctx.strokeStyle = ef.rimColor || "#fef08a";
 ctx.shadowColor = ef.rimColor || "#38bdf8";
 ctx.shadowBlur = 12;
 ctx.lineWidth = Math.max(1.5, (1 - prog) * 6);
 ctx.beginPath(); ctx.arc(ex, ey, r, 0, Math.PI * 2); ctx.stroke();
 ctx.restore();
 } else if (ef.type === "debris" || ef.type === "spark") {
 ctx.save();
 ctx.globalAlpha = Math.max(0, 1 - prog);
 ctx.fillStyle = ef.color || "#f97316";
 ctx.beginPath(); ctx.arc(ex, ey, (ef.size || 0.14) * TILE_SIZE * (1 - prog * 0.4), 0, Math.PI * 2); ctx.fill();
 ctx.restore();
 } else if (ef.type === "smoke") {
 const r = ((ef.size || 0.35) + prog * 0.65) * TILE_SIZE;
 ctx.save();
 ctx.globalAlpha = Math.max(0, (1 - prog) * 0.55);
 ctx.fillStyle = "#52525b";
 ctx.beginPath(); ctx.arc(ex, ey, r, 0, Math.PI * 2); ctx.fill();
 ctx.restore();
 }
 });
 }

 function drawRacerSprite(racer, now) {
 if (racer.isFalling) {
 const prog = Math.min(1, (now - racer.fallStart) / 1500);
 if (prog >= 1) return;
 const fx = (racer.fallStartX + racer.fallVx * prog) * TILE_SIZE;
 const fy = (racer.fallStartY + racer.fallVy * prog + 2.5 * prog * prog) * TILE_SIZE;
 const scale = Math.max(0.12, 1 - prog * 0.88);
 ctx.save();
 ctx.translate(fx, fy);
 ctx.scale(scale, scale);
 ctx.rotate(prog * 9);
 ctx.globalAlpha = Math.max(0, 1 - prog * 0.9);
 ctx.font = `${TILE_SIZE * 0.97}px sans-serif`;
 ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
 ctx.fillText(racer.emoji, 0, 0);
 ctx.restore();
 return;
 }

 const isCrashed = now < racer.crashedUntil;
 const isBoosted = now < racer.boostUntil;
 const rx = racer.tileX * TILE_SIZE;
 const ry = racer.tileY * TILE_SIZE;

 ctx.save(); ctx.translate(rx, ry);
 if (racer.facingRight) ctx.scale(-1, 1);
 if (isCrashed) {
 const spinElapsed = racer.crashStart ? (now - racer.crashStart) : 9999;
 if (spinElapsed < 650) ctx.rotate((spinElapsed * 0.012));
 else ctx.rotate(racer.wreckAngle || 0.45);
 } else if (racer.tiltAngle !== 0) {
 ctx.rotate(racer.tiltAngle);
 }

 if (isBoosted && !isCrashed) {
 ctx.shadowColor = "#06b6d4"; ctx.shadowBlur = 14;
 ctx.fillStyle = "rgba(56, 189, 248, 0.85)";
 ctx.beginPath();
 ctx.ellipse(TILE_SIZE * 0.55, 0, TILE_SIZE * 0.32, TILE_SIZE * 0.14, 0, 0, Math.PI * 2);
 ctx.fill();
 }
 if (racer.hueShift) ctx.filter = `hue-rotate(${racer.hueShift}deg) saturate(1.25)`;
 ctx.font = `${TILE_SIZE * 0.97}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
 ctx.fillText(racer.emoji, 0, 0);
 ctx.filter = "none"; ctx.shadowBlur = 0;
 if (isBoosted && !isCrashed) { ctx.font = `${TILE_SIZE * 0.50}px sans-serif`; ctx.fillText('⚡', TILE_SIZE * 0.65, -TILE_SIZE * 0.18); }
 ctx.restore();

 if (isCrashed) { ctx.font = `${TILE_SIZE * 0.62}px sans-serif`; ctx.fillText('💥', rx, ry - TILE_SIZE * 0.55); }
 else if (racer.stoppedByAnimal) { ctx.font = `${TILE_SIZE * 0.42}px sans-serif`; ctx.fillText('🛑', rx, ry - TILE_SIZE * 0.48); }
 }

 if (tile === 4) {
 ctx.fillStyle = "#facc15";
 ctx.fillRect(px - roadPad, py - roadPad, TILE_SIZE * 0.26, roadSpan);
 ctx.textAlign = "center"; ctx.textBaseline = "middle";
 ctx.font = `${TILE_SIZE * 0.90}px sans-serif`;
 ctx.fillText(EMOJIS.finish, px + TILE_SIZE / 2, py + TILE_SIZE / 2);
 }
 }
 }
 }

 activeBoosts.forEach(b => {
 ctx.save(); ctx.font = `${TILE_SIZE * 0.85}px sans-serif`;
 ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
 ctx.fillText('⚡', b.tileX * TILE_SIZE, b.tileY * TILE_SIZE);
 ctx.restore();
 });
 racers.forEach(r => { if (!r.isFalling && !r.eliminated) drawRacerSprite(r, now); });
 skyCloudsUpper.forEach(cl => drawCloudPuff(cl.x * TILE_SIZE, cl.y * TILE_SIZE, cl.scale, cl.alpha));
 } else {
 // Tracks T1-T6 and T9 Volcano Canyon
 ctx.fillStyle = cfg.isVolcano ? '#2d1208' : (cfg.isMountainCliff ? '#5c3a21' : (cfg.isCurvedNight ? '#0b1120' : (cfg.isSnow ? '#dbeafe' : '#4d8a3b')));
 ctx.fillRect(0, 0, canvas.width, canvas.height);

 for (let y = 0; y < rows; y++) {
 for (let x = 0; x < cols; x++) {
 const tile = map[y][x];
 if (tile === 2 || tile === 3) {
 ctx.textAlign = "center"; ctx.textBaseline = "middle";
 ctx.font = `${TILE_SIZE * 0.74}px sans-serif`;
 ctx.fillText(emojiMap[y][x], x * TILE_SIZE + TILE_SIZE / 2, y * TILE_SIZE + TILE_SIZE / 2);
 }
 }
 }

 if (cfg.isCurvedNight) {
 ctx.save(); ctx.lineCap = "round"; ctx.lineJoin = "round";
 ctx.beginPath();
 lapWaypoints.forEach((wp, i) => {
 const wx = (wp.x + 0.5) * TILE_SIZE, wy = (wp.y + 0.5) * TILE_SIZE;
 if (i === 0) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
 });
 ctx.closePath();
 ctx.strokeStyle = "#1e293b"; ctx.lineWidth = TILE_SIZE * 1.65; ctx.stroke();
 ctx.setLineDash([TILE_SIZE * 0.45, TILE_SIZE * 0.45]);
 ctx.strokeStyle = "rgba(250, 204, 21, 0.55)"; ctx.lineWidth = 2; ctx.stroke();
 ctx.setLineDash([]);
 const sx = (cfg.startCol + 0.5) * TILE_SIZE, sy = (cfg.startRow + 0.5) * TILE_SIZE;
 ctx.fillStyle = "#facc15"; ctx.fillRect(sx - 3, sy - TILE_SIZE * 0.8, 6, TILE_SIZE * 1.6);
 ctx.font = `${TILE_SIZE * 0.85}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
 ctx.fillText(EMOJIS.finish, sx, sy);
 ctx.restore();
 } else {
 const roadPad = TILE_SIZE * 0.075; const roadSpan = TILE_SIZE * 1.15;
 for (let y = 0; y < rows; y++) {
 for (let x = 0; x < cols; x++) {
 const tile = map[y][x];
 if (tile === 1 || tile === 4) {
 const px = x * TILE_SIZE; const py = y * TILE_SIZE;
 ctx.fillStyle = cfg.isVolcano ? "#1c1917" : (cfg.isSnow ? "#475569" : (currentTrackId === 4 ? "#1f2937" : "#374151"));
 ctx.fillRect(px - roadPad, py - roadPad, roadSpan, roadSpan);
 ctx.fillStyle = cfg.isVolcano ? "#fb923c" : (cfg.isSnow ? "#e0f2fe" : (currentTrackId === 4 ? "#fbbf24" : "#9ca3af"));
 ctx.fillRect(px + TILE_SIZE * 0.36, py + TILE_SIZE * 0.45, TILE_SIZE * 0.28, TILE_SIZE * 0.09);
 if (tile === 4) {
 ctx.fillStyle = "#facc15"; ctx.fillRect(px - roadPad, py - roadPad, TILE_SIZE * 0.26, roadSpan);
 ctx.textAlign = "center"; ctx.textBaseline = "middle";
 ctx.font = `${TILE_SIZE * 0.90}px sans-serif`; ctx.fillText(EMOJIS.finish, px + TILE_SIZE / 2, py + TILE_SIZE / 2);
 }
 }
 }
 }
 }

 drawCratersAndEffects(now);

 activeIcePatches.forEach(ip => {
 ctx.save(); ctx.fillStyle = "rgba(186, 230, 253, 0.72)";
 ctx.beginPath(); ctx.ellipse(ip.tileX * TILE_SIZE, ip.tileY * TILE_SIZE, TILE_SIZE * 0.55, TILE_SIZE * 0.35, 0, 0, Math.PI * 2); ctx.fill();
 ctx.font = `${TILE_SIZE * 0.65}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
 ctx.fillText("❄️", ip.tileX * TILE_SIZE, ip.tileY * TILE_SIZE); ctx.restore();
 });
 activeBoosts.forEach(b => {
 ctx.save(); ctx.font = `${TILE_SIZE * 0.85}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
 ctx.fillText('⚡', b.tileX * TILE_SIZE, b.tileY * TILE_SIZE); ctx.restore();
 });
 activeRocks.forEach(r => {
 ctx.font = `${TILE_SIZE * 0.85}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
 ctx.fillText(r.emoji || '🪨', r.tileX * TILE_SIZE, r.tileY * TILE_SIZE);
 });
 activeAnimals.forEach(a => {
 const ax = a.tileX * TILE_SIZE; const ay = a.tileY * TILE_SIZE;
 ctx.font = `${TILE_SIZE * 0.85}px sans-serif`; ctx.fillText(a.emoji, ax, ay);
 });
 racers.forEach(racer => { if (!isRacerOnOverpassBridge(racer)) drawRacerSprite(racer, now); });
 racers.forEach(racer => { if (isRacerOnOverpassBridge(racer)) drawRacerSprite(racer, now); });
 activeTrafficLights.forEach(light => {
 const lx = (light.x + 0.5) * TILE_SIZE; const ly = (light.y + 0.5) * TILE_SIZE;
 ctx.fillStyle = '#222'; ctx.fillRect(lx - TILE_SIZE*0.25, ly - TILE_SIZE*1.2, TILE_SIZE*0.5, TILE_SIZE*1.05);
 ctx.fillStyle = light.state === 'red' ? '#ff4444' : '#444'; ctx.beginPath(); ctx.arc(lx, ly - TILE_SIZE*0.95, TILE_SIZE*0.12, 0, Math.PI*2); ctx.fill();
 ctx.fillStyle = light.state === 'green' ? '#44ff44' : '#444'; ctx.beginPath(); ctx.arc(lx, ly - TILE_SIZE*0.35, TILE_SIZE*0.12, 0, Math.PI*2); ctx.fill();
 });
 }

 // White Flash Pulse on Big Blasts
 if (now < flashUntil) {
 const alpha = Math.max(0, ((flashUntil - now) / 130) * 0.42);
 ctx.save();
 ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
 ctx.fillRect(0, 0, canvas.width, canvas.height);
 ctx.restore();
 }

 // Fireworks
 if (celebrationActive || fireworks.length > 0) {
 if (celebrationActive && Math.random() < 0.24) {
 const x = (0.08 + Math.random() * 0.84) * canvas.width; const y = (0.08 + Math.random() * 0.65) * canvas.height;
 const colors = ['#facc15', '#f87171', '#60a5fa', '#34d399', '#c084fc', '#fb923c', '#ffffff'];
 for (let i = 0; i < 55; i++) fireworks.push({ x, y, vx: Math.cos((Math.PI * 2 * i) / 55) * (1.8 + Math.random() * 5.8), vy: Math.sin((Math.PI * 2 * i) / 55) * (1.8 + Math.random() * 5.8), color: colors[i % colors.length], alpha: 1, size: 3 + Math.random() * 3.5 });
 }
 for (let i = fireworks.length - 1; i >= 0; i--) {
 const p = fireworks[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.alpha -= 0.013;
 if (p.alpha <= 0) { fireworks.splice(i, 1); continue; }
 ctx.save(); ctx.globalAlpha = Math.max(0, p.alpha); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); ctx.restore();
 }
 }

 if (gameRunning && ((typeof remainingTimeMs !== "undefined" && remainingTimeMs <= 20000) || finishLinePhase)) {
 const pulse = 0.25 + 0.25 * Math.sin(now * 0.012);
 ctx.save(); ctx.strokeStyle = `rgba(239, 68, 68, ${pulse})`; ctx.lineWidth = 10; ctx.strokeRect(5, 5, canvas.width - 10, canvas.height - 10); ctx.restore();
 }
 ctx.restore();
 }

 // --- 8. INITIALIZATION & UI BINDING ---
 function resizeCanvasOnly() {
 const container = canvas.parentElement; const cw = container.clientWidth || 800; const ch = container.clientHeight || 500;
 const aspect = cols / rows; let width = cw; let height = cw / aspect;
 if (height > ch) { height = ch; width = ch * aspect; }
 canvas.width = Math.max(360, Math.floor(width)); canvas.height = Math.max(240, Math.floor(height)); TILE_SIZE = canvas.width / cols;
 }

 async function startGame() {
 if (gameRunning) return;
 await initAudioEngine(); playStartSound();
 if (racers.length === 0 || remainingTimeMs <= 0 || celebrationActive || finishLinePhase) {
 endGame(false); celebrationActive = false; finishLinePhase = false; podiumLocked = []; fireworks = []; remainingTimeMs = raceDurationMs;
 activeAnimals = []; activeRocks = []; activeBoosts = []; activeEmergencies = []; activeEffects = []; activeCraters = []; activeIcePatches = []; activeRoadObstacles = [];
 shakeUntil = 0; flashUntil = 0; slowMoUntil = 0; urgentAnnouncementQueue = []; prevTopThreeNames = ["", "", ""];
 hazardBanner.classList.add('hidden'); commentaryBanner.classList.add('hidden');

 buildActiveTrackMap(); resizeCanvasOnly();
 const cfg = TRACK_CONFIGS[currentTrackId];
 const chosenNames = Array.from(selectedStudents);
 const maxSpanCols = Math.max(4, (cols - 4) - cfg.startCol);
 const spacingCols = Math.min(0.42, maxSpanCols / Math.max(1, chosenNames.length));

 for (let b = 0; b < 12; b++) {
 if (hazardRoadCandidates.length > 0) {
 const pt = hazardRoadCandidates[Math.floor(Math.random() * hazardRoadCandidates.length)];
 activeBoosts.push({ tileX: pt.x + 0.5, tileY: pt.y + 0.5 });
 }
 }

 racers = chosenNames.map((name, idx) => {
 const laneOffset = ((idx % 5) - 2) * 0.17;
 const cObj = RACER_COLORS[idx % RACER_COLORS.length];
 const vEmoji = EXPANDED_FLEET[idx % EXPANDED_FLEET.length];
 const hueShift = idx >= 16 ? ((idx - 15) * 47) % 360 : 0;
 return { id: idx, name, emoji: vEmoji, color: cObj.hex, colorName: cObj.name, hueShift, tileX: cfg.startCol + 0.5 + (idx * spacingCols), tileY: cfg.startRow + 0.5 + laneOffset, baseSpeed: 1.65 + (Math.random() * 0.18), speed: 1.7, speedChangeTimer: 0, waypointIndex: 1, laps: 0, finishRank: 0, laneOffset, targetLaneOffset: laneOffset, facingRight: false, tiltAngle: 0, isStoppedAtLight: false, stoppedByAnimal: false, crashedUntil: 0, boostUntil: 0, passBoostUntil: 0, eliminated: false, isFalling: false };
 });
 }

 celebrationActive = false; fireworks = []; gameRunning = true;
 document.getElementById('messageOverlay').classList.add('hidden');
 document.getElementById('startButton').textContent = '🔄';
 raceStartTime = performance.now(); lastTime = raceStartTime; lastPanelRenderTime = raceStartTime;
 nextAnimalSpawnTime = raceStartTime + 2200; nextRockSpawnTime = raceStartTime + 2000; nextBoostSpawnTime = raceStartTime + 2000; nextLeaderDramaTime = raceStartTime + 4500; nextBlackIceTime = raceStartTime + 5000; nextPileupTime = raceStartTime + 9000; lastSpeechEndTime = raceStartTime;

 const trackIntro = currentTrackId === 7
 ? `Green light high in the sky on Track 7, the Sky Bridge Hairpins! No rocks or stop signs here—just sharp turns where one slip sends you falling through the clouds!`
 : currentTrackId === 8
 ? `Green light on Track 8, Skyway Curves! Watch those three glowing cyan skybridges and explosive obstacles on the sweeping turns!`
 : `Green light on Track ${currentTrackId}, ${TRACK_CONFIGS[currentTrackId].name}!`;
 speakCommentary('Emma', trackIntro, true);
 startBackgroundMusic(); animationFrameId = requestAnimationFrame(gameLoop);
 }

 function endGame(showWinnerModal = false) {
 gameRunning = false; finishLinePhase = false; stopBackgroundMusic(); setMusicAndHornsDucked(false);
 document.getElementById('startButton').textContent = '▶️';
 if (!showWinnerModal) {
 celebrationActive = false;
 if (animationFrameId) cancelAnimationFrame(animationFrameId);
 if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); activeUtterances.length = 0; }
 return;
 }
 if (racers.length > 0) {
 celebrationActive = true;
 const sorted = getSortedRacers();
 renderLeftPanelDOM(sorted);
 const first = sorted[0]; const second = sorted[1]; const third = sorted[2];
 document.getElementById('winnerEmoji').textContent = first.emoji;
 document.getElementById('messageTitle').textContent = `🎉 ${first.name} Wins! 🎉`;
 const podiumItems = [
 { place: '🥇 1st', racer: first, bg: 'bg-yellow-500/25 border-yellow-400', delayClass: '' },
 { place: '🥈 2nd', racer: second, bg: 'bg-gray-400/25 border-gray-300', delayClass: 'floating-delay-1' },
 { place: '🥉 3rd', racer: third, bg: 'bg-amber-600/25 border-amber-500', delayClass: 'floating-delay-2' }
 ].filter(item => item.racer);
 document.getElementById('podiumDetails').innerHTML = podiumItems.map(item => `<div class="border ${item.bg} rounded-xl p-2.5 text-center flex flex-col items-center shadow-lg"><span class="text-xs font-black uppercase text-gray-200">${item.place}</span><span class="text-4xl my-2 floating-vehicle ${item.delayClass}">${item.racer.emoji}</span><span class="font-extrabold text-sm text-white truncate w-full">${item.racer.name}</span><span class="text-[11px] text-yellow-300 font-semibold">${item.racer.laps} Laps</span></div>`).join('');
 document.getElementById('messageOverlay').classList.remove('hidden');
 if (soundInitialized) { try { const now = Tone.now() + 0.02; polySynth.triggerAttackRelease(['C4', 'E4', 'G4', 'C5'], '4n', now); } catch (e) {} }
 if ('speechSynthesis' in window) {
 speakCommentary('Emma', `Checkered flag victory! ${first.name} wins for Class ${currentClass}!`, true);
 }
 }
 }

 function gameLoop(now) {
 if (gameRunning) {
 const dt = now - lastTime; lastTime = now;
 const elapsed = now - raceStartTime; remainingTimeMs = Math.max(0, raceDurationMs - elapsed);
 if (remainingTimeMs > 0) {
 const totalSecs = Math.ceil(remainingTimeMs / 1000);
 document.getElementById('raceTimerDisplay').textContent = `${String(Math.floor(totalSecs / 60)).padStart(2, '0')}:${String(totalSecs % 60).padStart(2, '0')}`;
 } else {
 document.getElementById('raceTimerDisplay').textContent = `🏁 LAP`;
 if (!finishLinePhase) {
 finishLinePhase = true;
 hazardBannerIcon.textContent = '🏁';
 hazardBannerText.textContent = 'FINAL SPRINT! First to cross the 🏁 Finish Line wins!';
 hazardBanner.classList.remove('hidden');
 }
 }
 updateHazardsAndHorns(now, dt); updateRacers(now, dt);
 }
 drawTrack();
 if (gameRunning || celebrationActive || fireworks.length > 0) animationFrameId = requestAnimationFrame(gameLoop);
 }

 function renderStudentGrid() {
 studentGrid.innerHTML = '';
 CLASS_ROSTERS[currentClass].forEach(name => {
 const btn = document.createElement('button'); btn.type = 'button';
 btn.className = `student-card flex items-center justify-between px-3 py-2 rounded-xl border text-left font-semibold text-xs md:text-sm transition ${selectedStudents.has(name) ? 'selected text-white shadow-md' : 'bg-gray-900 border-gray-700 text-gray-300 hover:border-gray-500'}`;
 btn.innerHTML = `<span class="truncate">${name}</span><span class="text-xs ml-1">${selectedStudents.has(name) ? '✅' : ''}</span>`;
 btn.addEventListener('click', () => {
 if (selectedStudents.has(name)) selectedStudents.delete(name);
 else {
 if (selectedStudents.size >= MAX_RACERS) {
 const badge = document.getElementById('selectedCountBadge');
 badge.classList.remove('flash-red'); void badge.offsetWidth; badge.classList.add('flash-red');
 return;
 }
 selectedStudents.add(name);
 }
 renderStudentGrid();
 });
 studentGrid.appendChild(btn);
 });
 document.getElementById('selectedCountBadge').textContent = `${selectedStudents.size} / ${MAX_RACERS}`;
 document.getElementById('goToTrackBtn').disabled = selectedStudents.size === 0;
 }

 function switchClass(className) {
 if (currentClass !== className) {
 currentClass = className;
 selectedStudents = new Set(CLASS_ROSTERS[currentClass].slice(0, MAX_RACERS));
 }
 document.getElementById('classBtn6H2').classList.toggle('active', currentClass === '6H2');
 document.getElementById('classBtn5M2').classList.toggle('active', currentClass === '5M2');
 document.getElementById('activeClassBadge').textContent = `Class ${currentClass}`;
 document.getElementById('quickSwitchClassBtn').textContent = currentClass === '6H2' ? '5M2' : '6H2';
 renderStudentGrid();
 }

 document.getElementById('classBtn6H2').addEventListener('click', () => switchClass('6H2'));
 document.getElementById('classBtn5M2').addEventListener('click', () => switchClass('5M2'));
 document.getElementById('quickSwitchClassBtn').addEventListener('click', () => {
 switchClass(currentClass === '6H2' ? '5M2' : '6H2');
 racers = []; endGame(); document.getElementById('messageOverlay').classList.add('hidden'); startGame();
 });

 document.querySelectorAll('.track-btn').forEach(btn => btn.addEventListener('click', () => {
 currentTrackId = parseInt(btn.dataset.track, 10);
 document.querySelectorAll('.track-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.track, 10) === currentTrackId));
 if (!document.getElementById('gameScreen').classList.contains('hidden')) { racers = []; endGame(); document.getElementById('messageOverlay').classList.add('hidden'); startGame(); }
 }));

 document.querySelectorAll('.time-btn').forEach(btn => btn.addEventListener('click', () => {
 const mins = parseInt(btn.dataset.mins, 10); selectedDurationMinutes = mins; raceDurationMs = mins * 60 * 1000;
 document.querySelectorAll('.time-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.mins, 10) === mins));
 if (!gameRunning) document.getElementById('raceTimerDisplay').textContent = `${String(mins).padStart(2, '0')}:00`;
 }));

 document.getElementById('btnFirst16').addEventListener('click', () => { selectedStudents = new Set(CLASS_ROSTERS[currentClass].slice(0, MAX_RACERS)); renderStudentGrid(); });
 document.getElementById('btnRemaining').addEventListener('click', () => { const rem = CLASS_ROSTERS[currentClass].slice(MAX_RACERS); selectedStudents = new Set(rem.length > 0 ? rem.slice(0, MAX_RACERS) : CLASS_ROSTERS[currentClass].slice(0, MAX_RACERS)); renderStudentGrid(); });
 document.getElementById('btnRandom16').addEventListener('click', () => { selectedStudents = new Set([...CLASS_ROSTERS[currentClass]].sort(() => 0.5 - Math.random()).slice(0, MAX_RACERS)); renderStudentGrid(); });
 document.getElementById('btnClearAll').addEventListener('click', () => { selectedStudents.clear(); renderStudentGrid(); });

 document.getElementById('goToTrackBtn').addEventListener('click', () => {
 if (selectedStudents.size === 0) return;
 document.getElementById('selectionScreen').classList.add('hidden'); document.getElementById('gameScreen').classList.remove('hidden');
 setTimeout(() => { racers = []; endGame(); document.getElementById('messageOverlay').classList.add('hidden'); startGame(); }, 50);
 });

 document.getElementById('startButton').addEventListener('click', () => { if (gameRunning) { racers = []; endGame(); document.getElementById('messageOverlay').classList.add('hidden'); } startGame(); });
 document.getElementById('backButton').addEventListener('click', () => { endGame(false); document.getElementById('gameScreen').classList.add('hidden'); document.getElementById('selectionScreen').classList.remove('hidden'); });
 document.getElementById('overlayRestartBtn').addEventListener('click', () => { document.getElementById('messageOverlay').classList.add('hidden'); racers = []; endGame(); startGame(); });
 document.getElementById('overlayRosterBtn').addEventListener('click', () => { document.getElementById('messageOverlay').classList.add('hidden'); endGame(false); document.getElementById('gameScreen').classList.add('hidden'); document.getElementById('selectionScreen').classList.remove('hidden'); });

 const speedSliderEl = document.getElementById("speedSlider");
 const syncSpeed = () => {
 const v = parseFloat(speedSliderEl.value);
 simulationSpeed = Number.isFinite(v) ? v : 1;
 const lbl = document.getElementById("speedValueLabel");
 if (lbl) lbl.textContent = simulationSpeed.toFixed(2).replace(/\.00$/, "") + "x";
 };
 speedSliderEl.addEventListener("input", syncSpeed);
 syncSpeed();
 window.addEventListener('resize', () => {
 if (!document.getElementById('gameScreen').classList.contains('hidden')) resizeCanvasOnly();
 });
 renderStudentGrid();
 </script>
</body>
