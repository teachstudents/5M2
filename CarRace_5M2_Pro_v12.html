        html, body { height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; touch-action: none; }
        canvas { background-color: #4d8a3b; border: 3px solid #374151; border-radius: 0.75rem; width: 100%; height: 100%; object-fit: contain; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); z-index: 1; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #1f2937; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        
        .student-card.selected { background: linear-gradient(135deg, #2563eb, #1d4ed8); border-color: #93c5fd; transform: translateY(-1px); }
        .class-tab.active { background: linear-gradient(135deg, #f59e0b, #d97706); color: #111827; border-color: #fde68a; }
        .track-btn.active { background: linear-gradient(135deg, #ec4899, #be185d); color: #ffffff; border-color: #f9a8d4; }
        .time-btn.active { background-color: #10b981; color: #111827; border-color: #6ee7b7; }
        
        /* Flashing Animation for Max Racers */
        .flash-red { animation: flash 0.4s ease-in-out; }
        @keyframes flash { 0%, 100% { color: #4ade80; transform: scale(1); } 50% { color: #f87171; transform: scale(1.1); } }

        /* Floating Vehicle Animations for Winner Screen */
        @keyframes floatVehicle {
            0%, 100% { transform: translateY(0px) rotate(-3deg) scale(1); }
            50% { transform: translateY(-12px) rotate(4deg) scale(1.08); }
        }
        .floating-vehicle {
            display: inline-block;
            animation: floatVehicle 2.2s ease-in-out infinite;
            filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.5));
        }
        .floating-delay-1 { animation-delay: 0.3s; }
        .floating-delay-2 { animation-delay: 0.6s; }

                for (let s = 0; s <= steps; s++) {
                    const t = s / steps;
                    const cx = Math.round(p1.x + (p2.x - p1.x) * t);
                    const cy = Math.round(p1.y + (p2.y - p1.y) * t);

        }

        // --- 6. RACER UPDATE & HAZARDS ---
        function updateHazardsAndHorns(now, dt) {
            // Draw crash fires, ambulances & helicopters
            racers.forEach(r => {
                if (!r.eliminated) return;
                const rx = r.tileX * TILE_SIZE; const ry = r.tileY * TILE_SIZE;
                ctx.save();
                ctx.font = `${TILE_SIZE * 0.9}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(r.emoji, rx, ry);
                ctx.font = `${TILE_SIZE * 0.85}px sans-serif`;
                ctx.fillText("🔥", rx, ry - TILE_SIZE * 0.25);
                ctx.restore();
            });
            activeEmergencies.forEach(em => {
                const ax = em.ambX * TILE_SIZE; const ay = em.ambY * TILE_SIZE;
                const hx = em.heliX * TILE_SIZE; const hy = em.heliY * TILE_SIZE;
                const flash = Math.floor(now / 180) % 2 === 0;
                ctx.save();
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.beginPath();
                ctx.arc(ax, ay, TILE_SIZE * 0.55, 0, Math.PI * 2);
                ctx.fillStyle = flash ? "rgba(239, 68, 68, 0.35)" : "rgba(59, 130, 246, 0.35)";
                ctx.fill();
                ctx.font = `${TILE_SIZE * 0.95}px sans-serif`;
                ctx.fillText("🚑", ax, ay);
                
                ctx.restore();
            });


            activeTrafficLights.forEach(light => {
                light.timer -= dt;
                if (light.timer <= 0) {
                    if (light.state === 'green') { light.state = 'yellow'; light.timer = 900; }
                    else if (light.state === 'yellow') { light.state = 'red'; light.timer = 950; }
                    else { light.state = 'green'; light.timer = 10000 + Math.random() * 4000; } // Lights stay green much longer now!
                }
            });

            if (now > nextAnimalSpawnTime && activeAnimals.length < 4 && hazardRoadCandidates.length > 0) {
                const animalSpec = CROSSING_ANIMALS[Math.floor(Math.random() * CROSSING_ANIMALS.length)];
                const candidate = hazardRoadCandidates[Math.floor(Math.random() * hazardRoadCandidates.length)];
                const dir = Math.random() < 0.5 ? 1 : -1;
                activeAnimals.push({
                    emoji: animalSpec.emoji, name: animalSpec.name,
                    tileX: candidate.x + 0.5, tileY: candidate.y + 0.5 - (dir * 0.85),
                    endY: candidate.y + 0.5 + (dir * 0.85), roadRow: candidate.y,
                    direction: dir, speed: animalSpec.speed, announced: false
                });
                hazardBannerIcon.textContent = animalSpec.emoji;
                hazardBannerText.textContent = `${animalSpec.emoji} ${animalSpec.name} crossing the road!`;
                hazardBanner.classList.remove('hidden');
                if (Math.random() < 0.65) {
                    queueUrgentEventAnnouncement(`Heads up! A ${animalSpec.name} is wandering across the track!`);
                }
                nextAnimalSpawnTime = now + 2600 + Math.random() * 2400;
            }

            if (now > nextRockSpawnTime && activeRocks.length < 5 && hazardRoadCandidates.length > 0) {
                const pt = hazardRoadCandidates[Math.floor(Math.random() * hazardRoadCandidates.length)];
                activeRocks.push({ tileX: pt.x + 0.5, tileY: pt.y + 0.5, expiresAt: now + 11000 });
                nextRockSpawnTime = now + 2800 + Math.random() * 2500;
            }

            if (now > nextBoostSpawnTime && activeBoosts.length < 14 && hazardRoadCandidates.length > 0) {
                const pt = hazardRoadCandidates[Math.floor(Math.random() * hazardRoadCandidates.length)];
                const alreadyOccupied = activeBoosts.some(b => Math.hypot(b.tileX - (pt.x + 0.5), b.tileY - (pt.y + 0.5)) < 1.2);
                if (!alreadyOccupied) {
                    activeBoosts.push({ tileX: pt.x + 0.5, tileY: pt.y + 0.5 });
                }
                nextBoostSpawnTime = now + 1100 + Math.random() * 900;
            }

            if (now > nextRandomHornTime) {
                nextRandomHornTime = now + 2000 + Math.random() * 2800;
            }

            activeAnimals.forEach(a => a.tileY += a.direction * a.speed * simulationSpeed);
            activeAnimals = activeAnimals.filter(a => a.direction > 0 ? a.tileY < a.endY : a.tileY > a.endY);
            activeRocks = activeRocks.filter(r => now < r.expiresAt);
            if (activeAnimals.length === 0 && !racers.some(r => now < r.crashedUntil)) hazardBanner.classList.add('hidden');
        }

                
        function triggerBlackIceEvent() {
            if (!gameRunning || hazardRoadCandidates.length === 0) return;
            const now = performance.now();
            for (let i = 0; i < 6; i++) {
                const pt = hazardRoadCandidates[Math.floor(Math.random() * hazardRoadCandidates.length)];
                activeIcePatches.push({ tileX: pt.x + 0.5, tileY: pt.y + 0.5, until: now + 18000 });
            }
            hazardBannerIcon.textContent = "❄️🧊";
            hazardBannerText.textContent = "BLACK ICE ALERT! Watch out for slippery ice patches!";
            hazardBanner.classList.remove("hidden");
            queueUrgentEventAnnouncement("Watch out! Six sheets of black ice just formed on the track!");
        }

        function triggerPileupEvent() {
            if (!gameRunning) return;
            const now = performance.now();
            const active = getSortedRacers().filter(r => !r.eliminated && r.finishRank === 0);
            if (active.length <= 4) return;
            const victim = active[0];
            const runnerUp = active[1];
            triggerEliminationCrash(victim, "got caught in a sudden multi-car pileup", runnerUp ? runnerUp.name : "", now);
            if (active.length > 6 && active[2]) {
                active[2].crashedUntil = now + 1400;
                active[2].crashStart = now;
                active[2].wreckAngle = -0.4;
            }
        }

        function triggerEliminationCrash(racer, reason, nextLeaderName, now) {
            racer.eliminated = true;
            racer.crashedUntil = now + 999999; racer.crashStart = now; racer.wreckAngle = (Math.random() < 0.5 ? -1 : 1) * (0.35 + Math.random() * 0.45);
            const offX = (Math.random() < 0.5 ? -1 : 1) * (0.75 + Math.random() * 0.45);
            const offY = (Math.random() < 0.5 ? -1 : 1) * (0.75 + Math.random() * 0.45);
            racer.tileX = Math.max(1, Math.min(cols - 2, racer.tileX + offX));
            racer.tileY = Math.max(1, Math.min(rows - 2, racer.tileY + offY));
            playCrashSound();
            flashUntil = now + 110;
            shakeUntil = now + 320;
            slowMoUntil = now + 220;
            activeEffects.push({ type: "explosion", x: racer.tileX, y: racer.tileY, createdAt: now, until: now + 1200 });
            for (let p = 0; p < 24; p++) {
                const ang = Math.random() * Math.PI * 2;
                const spd = 0.03 + Math.random() * 0.11;
                activeEffects.push({
                    type: p < 16 ? "fireball" : "debris",
                    x: racer.tileX, y: racer.tileY,
                    vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
                    size: 0.14 + Math.random() * 0.22,
                    color: p % 3 === 0 ? "#fde047" : (p % 3 === 1 ? "#f97316" : "#ef4444"),
                    createdAt: now, until: now + 750 + Math.random() * 350
                });
            }
            for (let s = 0; s < 6; s++) {
                activeEffects.push({
                    type: "smoke",
                    x: racer.tileX + (Math.random() - 0.5) * 0.4, y: racer.tileY + (Math.random() - 0.5) * 0.4,
                    vx: (Math.random() - 0.5) * 0.02, vy: -0.035 - Math.random() * 0.02,
                    createdAt: now, until: now + 1400
                });
            }

            activeEmergencies.push({
                fireX: racer.tileX,
                fireY: racer.tileY,
                ambX: Math.random() < 0.5 ? 0.5 : cols - 1.5,
                ambY: racer.tileY,
                heliX: Math.random() < 0.5 ? -1 : cols + 1,
                heliY: Math.random() < 0.5 ? 1 : rows - 2,
                until: now + 9500
            });

            const vName = VEHICLE_NAMES[racer.emoji] || "car";
            hazardBannerIcon.textContent = "🔥💥🚑";
            hazardBannerText.textContent = `CRASH & FIRE! ${racer.name} is OUT of the race!`;
            hazardBanner.classList.remove("hidden");

            const leadText = nextLeaderName ? ` ${nextLeaderName} rockets into first place!` : "";
            const lines = [
                `DISASTER FOR THE LEADER! ${racer.name} in the ${vName} ${reason}, skidded off the track, and burst into flames! ${racer.name} is OUT of the race! An emergency ambulance is rushing in!${leadText}`,
                `UNBELIEVABLE DRAMA! First-place ${racer.name} ${reason} and spun off into the grass in a ball of fire! That ends ${racer.name}'s race! Look at the ambulance speeding to the scene!${leadText}`,
                `HUGE CRASH AT THE FRONT! ${racer.name} lost control in the ${vName} after ${reason}, went off-track, and started a fire! ${racer.name} is out of the game as emergency crews arrive!${leadText}`
            ];
            queueUrgentEventAnnouncement(lines[Math.floor(Math.random() * lines.length)]);
        }

        function updateRacers(now, dt) {
            const sortedByProgress = getSortedRacers();
            const leadScore = sortedByProgress.length > 0 ? computeRacerExactScore(sortedByProgress[0]) : 0;

            // Suspenseful leader/front-pack accident & fire event
            const isSnowMap = !!TRACK_CONFIGS[currentTrackId].isSnow;
            const activeCount = racers.filter(r => !r.eliminated && r.finishRank === 0).length;
            if (!finishLinePhase && activeCount > 5 && now > nextLeaderDramaTime && sortedByProgress.length >= 2) {
                nextLeaderDramaTime = now + (isSnowMap ? 2200 + Math.random() * 1800 : 3500 + Math.random() * 2200);
                const pool = sortedByProgress.filter(r => !r.eliminated && r.finishRank === 0).slice(0, isSnowMap ? 4 : 3);
                const victim = pool[Math.floor(Math.random() * pool.length)];
                const runnerUp = sortedByProgress.find(r => !r.eliminated && r.finishRank === 0 && r.id !== (victim && victim.id));
                if (victim && Math.random() < (isSnowMap ? 0.92 : 0.82)) {
                    const reasons = isSnowMap ? [
                        "hit black ice on the turn and slid off the snowy road",
                        "lost traction in the blizzard and skidded into a snowbank",
                        "spun out on the icy curve and slid off the track",
                        "slid sideways on the ice and exploded into a snowbank"
                    ] : [
                        "clipped another car on a sharp turn",
                        "swerved to avoid a stray animal on the road",
                        "hit a sharp turn way too fast",
                        "slammed into debris in the road in a massive fireball"
                    ];
                    triggerEliminationCrash(victim, reasons[Math.floor(Math.random() * reasons.length)], runnerUp ? runnerUp.name : "", now);
                }
            }

            // Update visual particle effects & wreck smoke
            activeEffects = activeEffects.filter(ef => now < ef.until);
            activeEffects.forEach(ef => {
                if (ef.type === "spark" || ef.type === "smoke" || ef.type === "fireball" || ef.type === "debris") { ef.x += ef.vx; ef.y += ef.vy; }
            });
            if (Math.random() < 0.35) {
                racers.forEach(r => {
                    if (r.eliminated) activeEffects.push({ type: "smoke", x: r.tileX, y: r.tileY - 0.2, vx: (Math.random()-0.5)*0.02, vy: -0.04, createdAt: now, until: now + 900 });
                });
            }

            // Automatic Black Ice & Pileup events
            if (!finishLinePhase && now > nextBlackIceTime) {
                nextBlackIceTime = now + 9500 + Math.random() * 6500;
                triggerBlackIceEvent();
            }
            if (!finishLinePhase && now > nextPileupTime) {
                nextPileupTime = now + 13000 + Math.random() * 7000;
                triggerPileupEvent();
            }

            // Expire & check Black Ice patches
            activeIcePatches = activeIcePatches.filter(ip => now < ip.until);

            // Animate ambulances & helicopters
            activeEmergencies = activeEmergencies.filter(em => now < em.until);
            activeEmergencies.forEach(em => {
                em.ambX += (em.fireX - em.ambX) * 0.035;
                em.ambY += (em.fireY - em.ambY) * 0.035;
                em.heliX += (em.fireX - em.heliX) * 0.045;
                em.heliY += (em.fireY - 0.6 - em.heliY) * 0.045;
            });

            racers.forEach(racer => {
                if (racer.eliminated) return;
                if (now < racer.crashedUntil) return;
                if (racer.finishRank > 0) return;

                // Smart Obstacle Avoidance / Drivable Rocks: Cars check slightly ahead and steer around rocks instead of always crashing!
                const hitRockIdx = activeRocks.findIndex(rock => Math.hypot(racer.tileX - rock.tileX, racer.tileY - rock.tileY) < 0.85);
                if (hitRockIdx !== -1) {
                    const rock = activeRocks[hitRockIdx];
                    // 70% chance cars deftly steer around the rock using their lane offset, 30% chance they clip it
                    if (Math.random() < 0.70) {
                        racer.laneOffset = racer.laneOffset > 0 ? -0.35 : 0.35; // Swerve around!
                    } else {
                        activeRocks.splice(hitRockIdx, 1); racer.crashedUntil = now + 1500; racer.crashStart = now; racer.wreckAngle = (Math.random() < 0.5 ? -1 : 1) * 0.4; playCrashSound();
                        const vName = VEHICLE_NAMES[racer.emoji] || 'car';
                        hazardBannerIcon.textContent = '🪨🔥💥';
                        hazardBannerText.textContent = `${racer.name} clipped a rock!`;
                        hazardBanner.classList.remove('hidden');
                        queueUrgentEventAnnouncement(`${racer.name} clipped a rock in the ${vName}!`);
                        return;
                    }
                }

                const hitIceIdx = activeIcePatches.findIndex(ip => Math.hypot(racer.tileX - ip.tileX, racer.tileY - ip.tileY) < 0.85);
                if (hitIceIdx !== -1) {
                    activeIcePatches.splice(hitIceIdx, 1);
                    racer.crashedUntil = now + 1100;
                    racer.crashStart = now;
                    racer.wreckAngle = (Math.random() < 0.5 ? -1 : 1) * 0.5;
                    racer.targetLaneOffset = racer.laneOffset > 0 ? -0.36 : 0.36;
                    queueUrgentEventAnnouncement(`${racer.name} hit black ice and spun sideways!`);
                    return;
                }
                const hitBoostIdx = activeBoosts.findIndex(b => Math.hypot(racer.tileX - b.tileX, racer.tileY - b.tileY) < 0.78);
                if (hitBoostIdx !== -1) {
                    activeBoosts.splice(hitBoostIdx, 1);
                    racer.boostUntil = now + 3800;
                    if (soundInitialized) { try { boostSynth.triggerAttackRelease('8n', Tone.now()); } catch (e) {} }
                    const vName = VEHICLE_NAMES[racer.emoji] || 'car';
                    queueUrgentEventAnnouncement(`${racer.name} hit a lightning boost in the ${vName}!`);
                }

                const blockingAnimal = activeAnimals.find(a => Math.hypot(racer.tileX - a.tileX, racer.tileY - a.tileY) < 1.1);
                if (blockingAnimal) {
                    if (!racer.stoppedByAnimal) {
                        if (!blockingAnimal.announced) {
                            blockingAnimal.announced = true;
                            const vName = VEHICLE_NAMES[racer.emoji] || 'car';
                            queueUrgentEventAnnouncement(`A ${blockingAnimal.name} is blocking ${racer.name}!`);
                        }
                    }
                    racer.stoppedByAnimal = true; return;
                } else racer.stoppedByAnimal = false;

                // Smooth multi-lane overtaking (no beeping)
                if (racer.targetLaneOffset === undefined) racer.targetLaneOffset = racer.laneOffset;
                const aheadRacer = racers.find(other =>
                    other.id !== racer.id &&
                    other.finishRank === 0 &&
                    Math.abs(other.laneOffset - racer.laneOffset) < 0.22 &&
                    Math.hypot(other.tileX - racer.tileX, other.tileY - racer.tileY) < 1.25 &&
                    computeRacerExactScore(other) > computeRacerExactScore(racer)
                );
                if (aheadRacer && (!racer.lastPassCheck || now - racer.lastPassCheck > 650)) {
                    racer.lastPassCheck = now;
                    const lanes = [-0.36, -0.18, 0, 0.18, 0.36];
                    const openLane = lanes.find(l => Math.abs(l - aheadRacer.laneOffset) >= 0.22) ?? (racer.laneOffset > 0 ? -0.34 : 0.34);
                    racer.targetLaneOffset = openLane;
                    racer.passBoostUntil = now + 900;
                    for (let g = 0; g < 4; g++) {
                        activeEffects.push({ type: "fireball", x: racer.tileX, y: racer.tileY, vx: (Math.random()-0.5)*0.06, vy: (Math.random()-0.5)*0.06, size: 0.10, color: "#facc15", createdAt: now, until: now + 420 });
                    }
                }
                racer.laneOffset += (racer.targetLaneOffset - racer.laneOffset) * 0.12;

                const targetNode = lapWaypoints[racer.waypointIndex];
                const targetTileX = targetNode.x + 0.5 + racer.laneOffset;
                const targetTileY = targetNode.y + 0.5 + racer.laneOffset;

                // Traffic Light: Leader gets green wave priority so leaders don't get unfairly stuck!
                let stoppingForLight = false;
                const upcomingLight = activeTrafficLights.find(l => l.wpIdx === racer.waypointIndex);
                if (upcomingLight && upcomingLight.state === 'red') {
                    const distToInter = Math.hypot(targetTileX - racer.tileX, targetTileY - racer.tileY);
                    if (distToInter < 1.5 && distToInter > 0.4) {
                        const rankIndex = sortedByProgress.findIndex(r => r.id === racer.id);
                        if (rankIndex > 0 || Math.random() < 0.5) stoppingForLight = true; // Leaders breeze through red lights more often!
                    }
                }
                if (stoppingForLight) { racer.isStoppedAtLight = true; return; } else racer.isStoppedAtLight = false;

                if (now > racer.speedChangeTimer) {
                    const rankIndex = sortedByProgress.findIndex(r => r.id === racer.id);
                    const myScore = computeRacerExactScore(racer);
                    const gapBehindLeader = Math.max(0, leadScore - myScore);

                    const isFinal20 = (typeof remainingTimeMs !== "undefined" && remainingTimeMs <= 20000) || finishLinePhase;
                    let chaosMultiplier = 0.92 + Math.random() * 0.48;
                    if (rankIndex === 0) {
                        const secondRacer = sortedByProgress[1];
                        const leadMargin = secondRacer ? Math.max(0, myScore - computeRacerExactScore(secondRacer)) : 0;
                        chaosMultiplier = leadMargin > (isFinal20 ? 0.35 : 0.65) ? (0.76 + Math.random() * 0.18) : (0.90 + Math.random() * 0.26);
                    } else if (rankIndex === 1 || rankIndex === 2) {
                        const duelBoost = isFinal20 ? 0.24 : 0.14;
                        chaosMultiplier = 1.08 + duelBoost + Math.random() * 0.32 + Math.min(0.45, gapBehindLeader * 0.06);
                    } else if (rankIndex <= 5) {
                        chaosMultiplier = 1.06 + Math.random() * 0.42 + Math.min(0.35, gapBehindLeader * 0.025);
                    } else {
                        chaosMultiplier = 1.15 + Math.random() * 0.55 + Math.min(0.42, gapBehindLeader * 0.03);
                    }

                    racer.speed = racer.baseSpeed * chaosMultiplier;
                    racer.speedChangeTimer = now + 700 + Math.random() * 800;
                }

                let finalSpeed = racer.speed;
                if (now < racer.boostUntil) finalSpeed *= 2.9;
                if (racer.passBoostUntil && now < racer.passBoostUntil) finalSpeed *= 1.15; // Smoother boost curve so cars don't stall out right after
                if (finishLinePhase) finalSpeed *= 1.35;

                const dx = targetTileX - racer.tileX; const dy = targetTileY - racer.tileY;
                const distTiles = Math.hypot(dx, dy); const slowFactor = (now < slowMoUntil) ? 0.35 : 1.0;
                const stepTiles = (finalSpeed * simulationSpeed * slowFactor) / 31;

                racer.headingAngle = Math.atan2(dy, dx);
                if (Math.abs(dx) > Math.abs(dy)) { racer.facingRight = dx > 0; racer.tiltAngle = 0; }
                else { racer.facingRight = false; racer.tiltAngle = dy > 0 ? -0.42 : 0.42; }

                if (distTiles <= stepTiles) {
                    const reachedWaypoint = racer.waypointIndex;
                    racer.tileX = targetTileX; racer.tileY = targetTileY;
                    racer.waypointIndex = (racer.waypointIndex + 1) % lapWaypoints.length;

                    if (reachedWaypoint === 0) {
                        racer.laps++;
                        playLapSound();

                        if (finishLinePhase && racer.finishRank === 0) {
                            podiumLocked.push(racer);
                            racer.finishRank = podiumLocked.length;

                            if (podiumLocked.length >= Math.min(3, racers.length)) {
                                endGame(true);
                                return;
                            }
                        }
                    }
                } else {
                    racer.tileX += (dx / distTiles) * stepTiles; racer.tileY += (dy / distTiles) * stepTiles;
                }
            });

            if (now - lastPanelRenderTime > 160) {
                lastPanelRenderTime = now;
                const currentSorted = getSortedRacers();
                if (gameRunning && currentSorted.length > 0 && now - raceStartTime > 1000) processLiveCommentary(currentSorted);
                renderLeftPanelDOM(currentSorted, now);
            }
        }

        function renderLeftPanelDOM(sortedList, now = performance.now()) {
            document.getElementById('leftRacerList').innerHTML = sortedList.map((r, index) => {
                const rank = index + 1;
                let badgeColor = 'bg-gray-700 text-gray-200'; let cardBorder = 'border-gray-700 bg-gray-900/90';

                else if (rank === 2) { badgeColor = 'bg-gray-300 text-gray-900'; }
                else if (rank === 3) { badgeColor = 'bg-amber-600 text-white'; }
                const isCrashed = now < r.crashedUntil;
                const isBoosted = now < r.boostUntil;
                const statusIcon = r.finishRank > 0
                    ? `🏁#${r.finishRank}`
                    : (isCrashed ? '🪨🔥💥' : (r.stoppedByAnimal ? '🐄' : (r.isStoppedAtLight ? '🔴' : (isBoosted ? '⚡' : `L${r.laps + 1}`))));
                return `<div class="flex items-center justify-between px-1.5 py-0.5 rounded-lg border ${cardBorder}">
                            <div class="flex items-center gap-1.5 min-w-0">
                                <span class="w-4 h-4 rounded-full text-[10px] font-black flex items-center justify-center shrink-0 ${badgeColor}">${rank}</span>
                                <div class="flex flex-col items-start leading-none min-w-0">
                                    <span class="font-bold text-[11px] text-white truncate max-w-[68px]">${r.name}</span>
                                    <span class="text-base mt-0.5 leading-none">${r.emoji}</span>
                                </div>
                            </div>
                            <div class="text-right shrink-0"><span class="text-[10px] font-extrabold text-yellow-400">${statusIcon}</span></div>

        }

        function drawRacerSprite(racer, now) {
            const isCrashed = now < racer.crashedUntil;
            const isBoosted = now < racer.boostUntil;
            const rx = racer.tileX * TILE_SIZE; const ry = racer.tileY * TILE_SIZE;



            ctx.save(); ctx.translate(rx, ry);
            if (racer.facingRight) ctx.scale(-1, 1);
            if (isCrashed) {
                const spinElapsed = racer.crashStart ? (now - racer.crashStart) : 9999;
                if (spinElapsed < 650) ctx.rotate((spinElapsed * 0.012));
                else ctx.rotate(racer.wreckAngle || 0.45);
            }
            else if (racer.tiltAngle !== 0) ctx.rotate(racer.tiltAngle);

            if (isBoosted && !isCrashed) {
                ctx.shadowColor = "#06b6d4";
                ctx.shadowBlur = 14;
                // Blue exhaust flame
                ctx.fillStyle = "rgba(56, 189, 248, 0.85)";
                ctx.beginPath();
                ctx.ellipse(TILE_SIZE * 0.55, 0, TILE_SIZE * 0.32, TILE_SIZE * 0.14, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            if (racer.hueShift) ctx.filter = `hue-rotate(${racer.hueShift}deg) saturate(1.25)`;
            ctx.font = `${TILE_SIZE * 0.97}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(racer.emoji, 0, 0);
            ctx.filter = "none";
            ctx.shadowBlur = 0;

            if (isBoosted && !isCrashed) { ctx.font = `${TILE_SIZE * 0.50}px sans-serif`; ctx.fillText('⚡', TILE_SIZE * 0.65, -TILE_SIZE * 0.18); }
            ctx.restore();

            if (isCrashed) { ctx.font = `${TILE_SIZE * 0.62}px sans-serif`; ctx.fillText('🪨🔥💥', rx, ry - TILE_SIZE * 0.55); }
            else if (racer.stoppedByAnimal) { ctx.font = `${TILE_SIZE * 0.42}px sans-serif`; ctx.fillText('🛑', rx, ry - TILE_SIZE * 0.48); }
        }

        function isRacerOnOverpassBridge(racer) {
            if (currentTrackId !== 4) return false;
            return [4, 6].includes(racer.waypointIndex);
        }

        // --- 7. RENDERING ---
        function drawTrack() {

                ctx.lineWidth = TILE_SIZE * 1.65;

            racers.forEach(racer => {

            if (cfg.overpasses && cfg.overpasses.length > 0) {
                cfg.overpasses.forEach(ov => {

                    ctx.fillStyle = '#4b5563';
                    ctx.fillRect(ox, oy - TILE_SIZE * 0.1, TILE_SIZE, TILE_SIZE * 1.2);
                    ctx.fillStyle = '#f59e0b';
                    ctx.fillRect(ox - 2, oy - TILE_SIZE * 0.1, 4, TILE_SIZE * 1.2);
                    ctx.fillRect(ox + TILE_SIZE - 2, oy - TILE_SIZE * 0.1, 4, TILE_SIZE * 1.2);
                    ctx.fillStyle = '#fef08a';
                    ctx.fillRect(ox + TILE_SIZE * 0.46, oy + TILE_SIZE * 0.25, TILE_SIZE * 0.08, TILE_SIZE * 0.5);

            }

            racers.forEach(racer => {
                if (isRacerOnOverpassBridge(racer)) drawRacerSprite(racer, now);
            });

            if (cfg.tunnels && cfg.tunnels.length > 0) {
                cfg.tunnels.forEach(t => {
                    const minX = Math.min(t.x1, t.x2) * TILE_SIZE;
                    const minY = Math.min(t.y1, t.y2) * TILE_SIZE;
                    const width = (Math.abs(t.x2 - t.x1) + 1) * TILE_SIZE;
                    const height = (Math.abs(t.y2 - t.y1) + 1) * TILE_SIZE;

                    ctx.fillStyle = 'rgba(17, 24, 39, 0.86)';
                    ctx.fillRect(minX, minY, width, height);
                    ctx.strokeStyle = '#9ca3af';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(minX, minY, width, height);

                    ctx.fillStyle = '#6b7280';
                    if (t.orientation === 'vertical') {
                        ctx.fillRect(minX - 3, minY, width + 6, TILE_SIZE * 0.28);
                        ctx.fillRect(minX - 3, minY + height - TILE_SIZE * 0.28, width + 6, TILE_SIZE * 0.28);
                    } else {
                        ctx.fillRect(minX, minY - 3, TILE_SIZE * 0.28, height + 6);
                        ctx.fillRect(minX + width - TILE_SIZE * 0.28, minY - 3, TILE_SIZE * 0.28, height + 6);
                    }

                    ctx.fillStyle = '#fde047';
                    ctx.font = `bold ${Math.max(9, TILE_SIZE * 0.32)}px Inter, sans-serif`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(`🏔️ ${t.label}`, minX + width / 2, minY + height / 2);
                });
            }


            if (cfg.isSnow) {
                ctx.save();
                ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
                for (let i = 0; i < 45; i++) {
                    const sx = ((i * 97 + now * 0.03) % canvas.width);

                }
                ctx.restore();
            }


            // Draw boost speed-lines & explosion/smoke/spark effects
            racers.forEach(r => {
                if (!r.eliminated && now < r.boostUntil) {
                    const rx = r.tileX * TILE_SIZE; const ry = r.tileY * TILE_SIZE;
                    ctx.save();
                    ctx.strokeStyle = r.color || "#38bdf8";
                    ctx.lineWidth = 2.5;
                    ctx.globalAlpha = 0.7;
                    for (let s = -1; s <= 1; s++) {
                        ctx.beginPath();
                        ctx.moveTo(rx - TILE_SIZE * 0.5, ry + s * 4);

                    }
                    ctx.restore();
                }
            });
            activeEffects.forEach(ef => {
                const prog = (now - ef.createdAt) / (ef.until - ef.createdAt);
                const ex = ef.x * TILE_SIZE; const ey = ef.y * TILE_SIZE;
                ctx.save();
                ctx.globalAlpha = Math.max(0, 1 - prog);
                if (ef.type === "explosion") {

                    ctx.beginPath();
                    ctx.arc(ex, ey, rad, 0, Math.PI * 2);
                    ctx.strokeStyle = prog < 0.4 ? "#fde047" : "#ef4444";
                    ctx.lineWidth = 4 * (1 - prog);
                    ctx.stroke();
                    ctx.font = `${TILE_SIZE * (1.2 + prog * 0.8)}px sans-serif`;
                    ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.fillText("💥", ex, ey);
                } else if (ef.type === "fireball") {
                    ctx.beginPath();
                    ctx.arc(ex, ey, TILE_SIZE * ef.size * (1 - prog * 0.5), 0, Math.PI * 2);

                    ctx.fill();
                } else if (ef.type === "debris") {
                    ctx.translate(ex, ey);
                    ctx.rotate(prog * 8);

                    ctx.fillRect(-3, -2, 6, 4);
                } else if (ef.type === "spark") {
                    ctx.font = `${TILE_SIZE * 0.55}px sans-serif`;

                    ctx.fillStyle = "rgba(75, 85, 99, 0.55)";

            activeTrafficLights.forEach(light => {
                const lx = (light.x + 0.5) * TILE_SIZE; const ly = (light.y + 0.5) * TILE_SIZE;

                ctx.fillStyle = light.state === 'yellow' ? '#ffff44' : '#444'; ctx.beginPath(); ctx.arc(lx, ly - TILE_SIZE*0.65, TILE_SIZE*0.12, 0, Math.PI*2); ctx.fill();

            });

            if (celebrationActive || fireworks.length > 0) {

                    const colors = ['#facc15', '#f87171', '#60a5fa', '#34d399', '#c084fc', '#fb923c', '#ffffff', '#f472b6'];
                    for (let i = 0; i < 55; i++) fireworks.push({ x: x, y: y, vx: Math.cos((Math.PI * 2 * i) / 55 + (Math.random() * 0.25)) * (1.8 + Math.random() * 5.8), vy: Math.sin((Math.PI * 2 * i) / 55 + (Math.random() * 0.25)) * (1.8 + Math.random() * 5.8), color: colors[i % colors.length], alpha: 1, size: 3 + Math.random() * 3.5 });
                    if(soundInitialized){ try{ fireworkNoise.triggerAttackRelease('8n', Tone.now()); polySynth.triggerAttackRelease([['C5', 'E5', 'G5', 'B5', 'C6', 'D6', 'E6'][Math.floor(Math.random() * 7)], 'G5'], '16n', Tone.now() + 0.05); }catch(e){} }
                }

                    if (p.alpha <= 0) { fireworks.splice(i, 1); continue; }
                    ctx.save(); ctx.globalAlpha = Math.max(0, p.alpha); ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 8; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); ctx.restore();
                }
            }
            
            // Night Headlights & Red Taillight Trails (Track 4 & Track 5)
            if (currentTrackId === 4 || cfg.isCurvedNight) {
                racers.forEach(r => {
                    if (r.eliminated) return;

                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            }
            ctx.restore();
        }

        // --- 8. INITIALIZATION & UI BINDING ---
        function resizeCanvasOnly() {
            const container = canvas.parentElement; const cw = container.clientWidth || 800; const ch = container.clientHeight || 500;
            const aspect = cols / rows; let width = cw; let height = cw / aspect;
            if (height > ch) { height = ch; width = ch * aspect; }
            canvas.width = Math.max(360, Math.floor(width)); canvas.height = Math.max(240, Math.floor(height)); TILE_SIZE = canvas.width / cols;
        }

        async function startGame() {
            if (gameRunning) return;
            await initAudioEngine(); playStartSound();
            if (racers.length === 0 || remainingTimeMs <= 0 || celebrationActive || finishLinePhase) {
                endGame(false); celebrationActive = false; finishLinePhase = false; podiumLocked = []; fireworks = []; remainingTimeMs = raceDurationMs;
                activeAnimals = []; activeRocks = []; activeBoosts = []; activeEmergencies = []; activeEffects = []; activeIcePatches = []; shakeUntil = 0; flashUntil = 0; slowMoUntil = 0; urgentAnnouncementQueue = []; prevTopThreeNames = ["", "", ""];
                hazardBanner.classList.add('hidden'); commentaryBanner.classList.add('hidden');
                
                buildActiveTrackMap(); resizeCanvasOnly();
                const cfg = TRACK_CONFIGS[currentTrackId]; const availableVehicles = [...FLEET_VEHICLES].sort(() => 0.5 - Math.random()); const chosenNames = Array.from(selectedStudents);
                const maxSpanCols = Math.max(4, (cols - 4) - cfg.startCol);
                const spacingCols = Math.min(0.42, maxSpanCols / Math.max(1, chosenNames.length));

                for (let b = 0; b < 14; b++) {
                    if (hazardRoadCandidates.length > 0) {
                        const pt = hazardRoadCandidates[Math.floor(Math.random() * hazardRoadCandidates.length)];
                        activeBoosts.push({ tileX: pt.x + 0.5, tileY: pt.y + 0.5 });
                    }
                }

                racers = chosenNames.map((name, idx) => {
                    const laneOffset = ((idx % 5) - 2) * 0.17;
                    const cObj = RACER_COLORS[idx % RACER_COLORS.length];
                    const vEmoji = EXPANDED_FLEET[idx % EXPANDED_FLEET.length];
                    const hueShift = idx >= 16 ? ((idx - 15) * 47) % 360 : 0;
                    return { id: idx, name: name, emoji: vEmoji, color: cObj.hex, colorName: cObj.name, hueShift: hueShift, tileX: cfg.startCol + 0.5 + (idx * spacingCols), tileY: cfg.startRow + 0.5 + laneOffset, baseSpeed: 1.65 + (Math.random() * 0.18), speed: 1.7, speedChangeTimer: 0, waypointIndex: 1, laps: 0, finishRank: 0, laneOffset: laneOffset, targetLaneOffset: laneOffset, facingRight: false, tiltAngle: 0, isStoppedAtLight: false, stoppedByAnimal: false, crashedUntil: 0, boostUntil: 0, passBoostUntil: 0, eliminated: false };
                });
            }

            celebrationActive = false; fireworks = []; gameRunning = true;
            document.getElementById('messageOverlay').classList.add('hidden'); document.getElementById('startButton').textContent = '🔄';
            raceStartTime = performance.now(); lastTime = raceStartTime; lastPanelRenderTime = raceStartTime;
            nextAnimalSpawnTime = raceStartTime + 2200; nextRockSpawnTime = raceStartTime + 2000; nextBoostSpawnTime = raceStartTime + 2000; nextLeaderDramaTime = raceStartTime + 4500; nextBlackIceTime = raceStartTime + 5000; nextPileupTime = raceStartTime + 9000; nextRandomHornTime = raceStartTime + 1800; lastSpeechEndTime = raceStartTime;

            const trackIntro = currentTrackId === 4
                ? `Green light on Track 4, the Overpass and Tunnel Circuit! Watch cars race through the mountain tunnels, underpasses, and bridges!`
                : `Green light on Track ${currentTrackId}, ${TRACK_CONFIGS[currentTrackId].name}! Watch out for animal crossings, rock crashes, and lightning power boosts!`;
            speakCommentary('Emma', trackIntro, true);
            startBackgroundMusic(); animationFrameId = requestAnimationFrame(gameLoop);
        }

        function endGame(showWinnerModal = false) {
            gameRunning = false; finishLinePhase = false; stopBackgroundMusic(); setMusicAndHornsDucked(false); document.getElementById('startButton').textContent = '▶️';
            if (!showWinnerModal) { celebrationActive = false; if (animationFrameId) cancelAnimationFrame(animationFrameId); if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); activeUtterances.length = 0; } return; }

            if (racers.length > 0) {
                celebrationActive = true;
                const sorted = getSortedRacers();
                renderLeftPanelDOM(sorted);

                const first = sorted[0]; const second = sorted[1]; const third = sorted[2];
                document.getElementById('winnerEmoji').textContent = first.emoji; document.getElementById('messageTitle').textContent = `🎉 ${first.name} Wins! 🎉`;

                const podiumItems = [
                    { place: '🥇 1st', racer: first, bg: 'bg-yellow-500/25 border-yellow-400', delayClass: '' },
                    { place: '🥈 2nd', racer: second, bg: 'bg-gray-400/25 border-gray-300', delayClass: 'floating-delay-1' },
                    { place: '🥉 3rd', racer: third, bg: 'bg-amber-600/25 border-amber-500', delayClass: 'floating-delay-2' }
                ].filter(item => item.racer);
                document.getElementById('podiumDetails').innerHTML = podiumItems.map(item => `<div class="border ${item.bg} rounded-xl p-2.5 text-center flex flex-col items-center shadow-lg"><span class="text-xs font-black uppercase text-gray-200">${item.place}</span><span class="text-4xl my-2 floating-vehicle ${item.delayClass}">${item.racer.emoji}</span><span class="font-extrabold text-sm text-white truncate w-full">${item.racer.name}</span><span class="text-[11px] text-yellow-300 font-semibold">${item.racer.laps} Laps</span></div>`).join('');

                document.getElementById('messageOverlay').classList.remove('hidden');

                for (let b = 0; b < 5; b++) {
                    setTimeout(() => {
                        if (!celebrationActive) return;
                        const x = (0.1 + Math.random() * 0.8) * canvas.width;
                        const y = (0.1 + Math.random() * 0.6) * canvas.height;
                        const colors = ['#facc15', '#f87171', '#60a5fa', '#34d399', '#c084fc', '#fb923c', '#ffffff'];
                        for (let i = 0; i < 60; i++) {
                            fireworks.push({
                                x, y,
                                vx: Math.cos((Math.PI * 2 * i) / 60 + Math.random() * 0.2) * (2 + Math.random() * 5.5),
                                vy: Math.sin((Math.PI * 2 * i) / 60 + Math.random() * 0.2) * (2 + Math.random() * 5.5),
                                color: colors[i % colors.length], alpha: 1, size: 3 + Math.random() * 3.5
                            });
                        }
                        if (soundInitialized) {
                            try {
                                fireworkNoise.triggerAttackRelease('8n', Tone.now());
                                polySynth.triggerAttackRelease(['C5', 'G5', 'C6'], '16n', Tone.now() + 0.04);
                            } catch (e) {}
                        }
                    }, b * 260);
                }

                if(soundInitialized) { try{const now = Tone.now() + 0.02; polySynth.triggerAttackRelease(['C4', 'E4', 'G4', 'C5'], '4n', now); polySynth.triggerAttackRelease(['E4', 'G4', 'C5', 'E5'], '4n', now + 0.25); polySynth.triggerAttackRelease(['G4', 'C5', 'E5', 'G5'], '2n', now + 0.5); }catch(e){} }
                if (!('speechSynthesis' in window) || sorted.length === 0) return;
                window.speechSynthesis.cancel(); activeUtterances.length = 0; loadVoices();
                
                const v1 = VEHICLE_NAMES[first.emoji] || 'car'; const v2 = second ? (VEHICLE_NAMES[second.emoji] || 'car') : ''; const v3 = third ? (VEHICLE_NAMES[third.emoji] || 'car') : '';
                const winOpeners = [
                    `Across the finish line with fireworks lighting up the sky! Winning first place for Class ${currentClass} is ${first.name} driving the ${v1}!`,
                    `Checkered flag victory! ${first.name} takes the championship crown for Class ${currentClass} aboard the ${v1}!`,
                    `What an unforgettable grand finale! ${first.name} storms across the finish line in first place in the ${v1}!`
                ];
                const winClosers = [
                    second && third ? `Spectacular racing! Taking second place on the podium is ${second.name} in the ${v2}, and clinching third place is ${third.name} in the ${v3}!` : `A legendary victory!`,
                    second && third ? `Look at those floating podium rides! ${second.name} grabs silver in the ${v2}, and ${third.name} takes bronze in the ${v3}!` : `What a performance!`
                ];
                const u1 = new SpeechSynthesisUtterance(winOpeners[Math.floor(Math.random() * winOpeners.length)]); u1.volume = 1.0; u1.rate = 1.0; if (emmaVoice) u1.voice = emmaVoice;
                u1.onstart = () => { setMusicAndHornsDucked(true); commentaryBanner.classList.remove('hidden'); commentaryText.textContent = `Emma: "${u1.text}"`; };
                const u2 = new SpeechSynthesisUtterance(winClosers[Math.floor(Math.random() * winClosers.length)]); u2.volume = 1.0; u2.rate = 1.0; if (andrewVoice) u2.voice = andrewVoice;
                u2.onstart = () => { setMusicAndHornsDucked(true); commentaryBanner.classList.remove('hidden'); commentaryText.textContent = `Andrew: "${u2.text}"`; }; u2.onend = () => setMusicAndHornsDucked(false);
                activeUtterances.push(u1, u2); window.speechSynthesis.speak(u1); window.speechSynthesis.speak(u2);
            }
        }

        function gameLoop(now) {
            if (gameRunning) {
                const dt = now - lastTime; lastTime = now;
                const elapsed = now - raceStartTime; remainingTimeMs = Math.max(0, raceDurationMs - elapsed);
                if (remainingTimeMs > 0) {
                    const totalSecs = Math.ceil(remainingTimeMs / 1000);
                    document.getElementById('raceTimerDisplay').textContent = `${String(Math.floor(totalSecs / 60)).padStart(2, '0')}:${String(totalSecs % 60).padStart(2, '0')}`;
                } else {
                    document.getElementById('raceTimerDisplay').textContent = `🏁 LAP`;
                    if (!finishLinePhase) {
                        finishLinePhase = true;
                        hazardBannerIcon.textContent = '🏁';
                        hazardBannerText.textContent = 'FINAL SPRINT! First to cross the 🏁 Finish Line wins!';
                        hazardBanner.classList.remove('hidden');
                        queueUrgentEventAnnouncement(`Time is up! Checkered flag is out at the finish line! First cars to cross the finish line take first, second, and third!`);
                    }
                }
                updateHazardsAndHorns(now, dt); updateRacers(now, dt);
            }
            drawTrack();
            if (gameRunning || celebrationActive || fireworks.length > 0) animationFrameId = requestAnimationFrame(gameLoop);
        }

        function renderStudentGrid() {
            studentGrid.innerHTML = '';
            CLASS_ROSTERS[currentClass].forEach(name => {
                const btn = document.createElement('button'); btn.type = 'button';
                btn.className = `student-card flex items-center justify-between px-3 py-2 rounded-xl border text-left font-semibold text-xs md:text-sm transition ${selectedStudents.has(name) ? 'selected text-white shadow-md' : 'bg-gray-900 border-gray-700 text-gray-300 hover:border-gray-500'}`;
                btn.innerHTML = `<span class="truncate">${name}</span><span class="text-xs ml-1">${selectedStudents.has(name) ? '✅' : ''}</span>`;
                btn.addEventListener('click', () => {
                    if (selectedStudents.has(name)) {
                        selectedStudents.delete(name);
                    } else { 
                        if (selectedStudents.size >= MAX_RACERS) { 
                            const badge = document.getElementById('selectedCountBadge');
                            badge.classList.remove('flash-red');
                            void badge.offsetWidth; 
                            badge.classList.add('flash-red');
                            return; 
                        } 
                        selectedStudents.add(name); 
                    }
                    renderStudentGrid();
                });
                studentGrid.appendChild(btn);
            });
            document.getElementById('selectedCountBadge').textContent = `${selectedStudents.size} / ${MAX_RACERS}`;
            document.getElementById('goToTrackBtn').disabled = selectedStudents.size === 0;
        }

        function switchClass(className) {
            if (currentClass !== className) {
                currentClass = className; 
                selectedStudents = new Set(CLASS_ROSTERS[currentClass].slice(0, MAX_RACERS));
            }
            document.getElementById('classBtn6H2').classList.toggle('active', currentClass === '6H2');
            document.getElementById('classBtn5M2').classList.toggle('active', currentClass === '5M2');
            document.getElementById('activeClassBadge').textContent = `Class ${currentClass}`;
            document.getElementById('quickSwitchClassBtn').textContent = currentClass === '6H2' ? '5M2' : '6H2';
            renderStudentGrid();
        }

        document.getElementById('classBtn6H2').addEventListener('click', () => switchClass('6H2'));
        document.getElementById('classBtn5M2').addEventListener('click', () => switchClass('5M2'));
        document.getElementById('quickSwitchClassBtn').addEventListener('click', () => { 
            switchClass(currentClass === '6H2' ? '5M2' : '6H2'); 
            racers = [];
            endGame(); document.getElementById('messageOverlay').classList.add('hidden'); startGame(); 
        });

        document.querySelectorAll('.track-btn').forEach(btn => btn.addEventListener('click', () => {
            currentTrackId = parseInt(btn.dataset.track, 10);
            document.querySelectorAll('.track-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.track, 10) === currentTrackId));
            if (!document.getElementById('gameScreen').classList.contains('hidden')) { racers = []; endGame(); document.getElementById('messageOverlay').classList.add('hidden'); startGame(); }
        }));
        
        document.querySelectorAll('.time-btn').forEach(btn => btn.addEventListener('click', () => {
            const mins = parseInt(btn.dataset.mins, 10); selectedDurationMinutes = mins; raceDurationMs = mins * 60 * 1000;
            document.querySelectorAll('.time-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.mins, 10) === mins));
            if (!gameRunning) document.getElementById('raceTimerDisplay').textContent = `${String(mins).padStart(2, '0')}:00`;
        }));

        document.getElementById('btnFirst16').addEventListener('click', () => { selectedStudents = new Set(CLASS_ROSTERS[currentClass].slice(0, MAX_RACERS)); renderStudentGrid(); });
        document.getElementById('btnRemaining').addEventListener('click', () => { const rem = CLASS_ROSTERS[currentClass].slice(MAX_RACERS); selectedStudents = new Set(rem.length > 0 ? rem.slice(0, MAX_RACERS) : CLASS_ROSTERS[currentClass].slice(0, MAX_RACERS)); renderStudentGrid(); });
        document.getElementById('btnRandom16').addEventListener('click', () => { selectedStudents = new Set([...CLASS_ROSTERS[currentClass]].sort(() => 0.5 - Math.random()).slice(0, MAX_RACERS)); renderStudentGrid(); });
        document.getElementById('btnClearAll').addEventListener('click', () => { selectedStudents.clear(); renderStudentGrid(); });

        document.getElementById('goToTrackBtn').addEventListener('click', () => {
            if (selectedStudents.size === 0) return;
            document.getElementById('selectionScreen').classList.add('hidden'); document.getElementById('gameScreen').classList.remove('hidden');
            setTimeout(() => { racers = []; endGame(); document.getElementById('messageOverlay').classList.add('hidden'); startGame(); }, 50);
        });

        document.getElementById('startButton').addEventListener('click', () => { if (gameRunning) { racers = []; endGame(); document.getElementById('messageOverlay').classList.add('hidden'); } startGame(); });
        document.getElementById('backButton').addEventListener('click', () => { endGame(false); document.getElementById('gameScreen').classList.add('hidden'); document.getElementById('selectionScreen').classList.remove('hidden'); });
        document.getElementById('overlayRestartBtn').addEventListener('click', () => { document.getElementById('messageOverlay').classList.add('hidden'); racers = []; endGame(); startGame(); });
        document.getElementById('overlayRosterBtn').addEventListener('click', () => { document.getElementById('messageOverlay').classList.add('hidden'); endGame(false); document.getElementById('gameScreen').classList.add('hidden'); document.getElementById('selectionScreen').classList.remove('hidden'); });
        const speedSliderEl = document.getElementById("speedSlider");
        const syncSpeed = () => {
            const v = parseFloat(speedSliderEl.value);
            simulationSpeed = Number.isFinite(v) ? v : 1;
            const lbl = document.getElementById("speedValueLabel");
            if (lbl) lbl.textContent = simulationSpeed.toFixed(2).replace(/\.00$/, "") + "x";
        };
        speedSliderEl.addEventListener("input", syncSpeed);
        speedSliderEl.addEventListener("change", syncSpeed);
        syncSpeed();

        
        window.addEventListener('resize', () => {
            if (!document.getElementById('gameScreen').classList.contains('hidden')) {
                resizeCanvasOnly();
                drawTrack();
            }
        });

        switchClass(currentClass);
    </script>
</body>
</html>
