<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5M2 Co-Construction Hub</title>
  <style>
    :root {
      --navy: #0f2547;
      --navy-dark: #09172e;
      --cream: #fbf6ea;
      --gold: #d99b26;
      --blue: #1d4ed8;
      --green: #047857;
      --red: #dc2626;
      --text: #0f172a;
      --muted: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #e2e8f0;
      color: var(--text);
      overflow: hidden;
    }
    .app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

    /* TOP BAR */
    .topbar {
      background: var(--navy-dark);
      color: #ffffff;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 3px solid var(--gold);
      flex-shrink: 0;
    }
    .activity-select {
      background: #1e3a8a;
      color: #ffffff;
      border: 2px solid var(--gold);
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: 800;
      font-size: 1.02rem;
      cursor: pointer;
    }
    .topbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .freeze-btn {
      border: 2px solid #fca5a5;
      background: #dc2626;
      color: #ffffff;
      font-weight: 900;
      font-size: 0.96rem;
      padding: 7px 13px;
      border-radius: 10px;
      cursor: pointer;
    }
    .freeze-btn.running { animation: pulse 0.8s infinite; }
    .remind-btn {
      border: 2px solid #93c5fd;
      background: #1d4ed8;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.92rem;
      padding: 7px 12px;
      border-radius: 10px;
      cursor: pointer;
    }
    .boys-btn {
      border: 2px solid #c4b5fd;
      background: #7c3aed;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.92rem;
      padding: 7px 12px;
      border-radius: 10px;
      cursor: pointer;
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

    .reset-counter {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.12);
      padding: 6px 12px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.95rem;
    }
    .reset-pill {
      background: #10b981;
      color: #052e16;
      padding: 3px 11px;
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
      font-weight: 900;
    }

    /* MAIN SPLIT WORKSPACE */
    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 2.8fr 1fr;
      gap: 12px;
      padding: 12px 14px;
      min-height: 0;
      background: linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%);
    }

    /* LEFT: INSTRUCTIONS & EMBEDDED TIMERS */
    .stage { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .banner {
      background: var(--navy);
      color: #ffffff;
      border-radius: 14px;
      padding: 14px 20px;
      box-shadow: 0 6px 16px rgba(15, 37, 71, 0.2);
      flex-shrink: 0;
    }
    .banner-title { font-size: clamp(1.3rem, 2vw, 1.85rem); font-weight: 900; color: var(--gold); }
    .obj-row { display: flex; align-items: flex-start; gap: 10px; margin-top: 8px; }
    .obj-badge {
      background: var(--gold);
      color: #0f172a;
      font-weight: 900;
      font-size: 0.92rem;
      padding: 4px 10px;
      border-radius: 7px;
      text-transform: uppercase;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .obj-text { font-size: clamp(1.08rem, 1.38vw, 1.32rem); font-weight: 700; color: #ffffff; line-height: 1.35; }

    .cards-grid { flex: 1; display: grid; grid-template-columns: 1fr 1.28fr 1fr; gap: 12px; min-height: 0; }
    .card {
      background: var(--cream);
      border: 3px solid #cbd5e1;
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
      min-height: 0;
    }
    .card.active-card {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(217, 155, 38, 0.35), 0 10px 22px rgba(15, 23, 42, 0.14);
    }
    .step-pill {
      color: #ffffff;
      font-weight: 900;
      font-size: clamp(1.1rem, 1.45vw, 1.4rem);
      padding: 8px 12px;
      border-radius: 10px;
      text-align: center;
    }
    .pill-blue { background: var(--navy); }
    .pill-gold { background: var(--gold); color: #0f172a; }
    .pill-green { background: var(--green); }
    .step-sub { font-size: 1rem; font-weight: 800; color: var(--muted); text-align: center; margin-top: 6px; }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 9px;
      padding: 10px 2px;
      overflow-y: auto;
    }
    .sentence-box {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 11px;
      padding: 10px 12px;
      font-size: clamp(1.02rem, 1.24vw, 1.22rem);
      line-height: 1.38;
      font-weight: 700;
      color: var(--text);
    }

    /* EMBEDDED CARD TIMER */
    .card-timer {
      background: var(--navy-dark);
      color: #ffffff;
      border-radius: 12px;
      padding: 9px 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex-shrink: 0;
    }
    .timer-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .timer-digits {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: clamp(1.7rem, 2.2vw, 2.25rem);
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.04em;
    }
    .timer-digits.warning { color: #fbbf24; }
    .timer-digits.done { color: #f87171; animation: pulse 0.8s infinite; }

    .timer-btns { display: flex; gap: 5px; flex-wrap: wrap; }
    .t-btn { border: none; border-radius: 8px; padding: 7px 10px; font-weight: 900; font-size: 0.92rem; cursor: pointer; }
    .t-start { background: #10b981; color: #052e16; }
    .t-pause { background: #f59e0b; color: #0f172a; }
    .t-reset { background: #475569; color: #ffffff; }
    .t-plus { background: #3b82f6; color: #ffffff; }

    .share-quick { display: flex; gap: 5px; align-items: center; justify-content: space-between; }
    .q-btn {
      flex: 1;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.12);
      color: #fde68a;
      border-radius: 7px;
      padding: 5px 6px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .q-btn:hover { background: rgba(255,255,255,0.22); }
    .q-next { flex: 1.5; background: var(--gold); color: #0f172a; border: none; }

    /* RIGHT: 23-STUDENT PARTNER & RANDOM ORDER PANEL */
    .roster-panel {
      background: #ffffff;
      border: 2px solid var(--navy);
      border-radius: 12px;
      padding: 9px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-height: 0;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.1);
    }
    .panel-title { font-size: 0.88rem; font-weight: 900; color: var(--navy); border-bottom: 2px solid #e2e8f0; padding-bottom: 4px; }
    .student-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .stu-chip {
      border: 1.5px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
      font-weight: 800;
      font-size: 0.68rem;
      padding: 5px 3px;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stu-chip:hover { border-color: var(--blue); background: #eff6ff; }
    .stu-chip.picking { background: var(--gold); border-color: #b45309; color: #0f172a; transform: scale(1.03); }
    .stu-chip.grouped { background: #e2e8f0; border-color: #94a3b8; color: #64748b; opacity: 0.5; }

    .panel-actions { display: flex; flex-wrap: wrap; gap: 4px; }
    .act-btn { flex: 1; border: none; border-radius: 6px; padding: 6px 5px; font-weight: 800; font-size: 0.68rem; cursor: pointer; color: #ffffff; white-space: nowrap; }
    .btn-pair { background: #1d4ed8; }
    .btn-auto { background: #047857; }
    .btn-shuffle { background: #7c3aed; }
    .btn-next { background: #d97706; color: #0f172a; }
    .btn-clear { background: #64748b; }

    .groups-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding-right: 3px; }
    .group-card { display: flex; align-items: center; justify-content: space-between; gap: 4px; background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 8px; padding: 5px 7px; font-weight: 800; font-size: 0.74rem; }
    .group-card.presenting { background: #fef3c7; border-color: #d97706; box-shadow: 0 0 0 2px rgba(217, 155, 38, 0.3); }
    .group-order { background: var(--navy); color: #ffffff; font-size: 0.64rem; font-weight: 900; padding: 2px 6px; border-radius: 999px; min-width: 24px; text-align: center; }
    .group-card.presenting .group-order { background: #d97706; color: #0f172a; }
    .group-names { flex: 1; color: #0f172a; }
    .group-pts { background: #10b981; color: #052e16; border: none; border-radius: 999px; padding: 3px 7px; font-weight: 900; font-size: 0.64rem; cursor: pointer; }
    .group-pts:hover { background: #34d399; }
    .group-remove { background: transparent; border: none; color: #94a3b8; font-weight: 900; cursor: pointer; font-size: 0.78rem; }
    .group-remove:hover { color: #dc2626; }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <select id="activitySelect" class="activity-select" onchange="loadActivity(this.value)">
        <option value="mini_account">2-Partner Mini Crime Account</option>
        <option value="library_deduction">Missing Library Book Deduction</option>
        <option value="when_while_swap">When vs. While Clause Inversion</option>
        <option value="alibi_clash">Alibi Clash Novel Sequence</option>
        <option value="red_herring">Clue vs. Red Herring Creation</option>
        <option value="suspense_hook">Library Suspense Transfer</option>
        <option value="sentence_upgrade">Sentence Auction &amp; Upgrade</option>
        <option value="case_blueprint">Case Blueprint &amp; Logic Audit</option>
      </select>

      <div class="topbar-right">
        <button class="boys-btn" onclick="speakBoysReminder()" title="Justin, Yihan, Charles, Kenneth, listen quietly and speak English softly">🔊 1</button>
        <button id="freezeBtn" class="freeze-btn" onclick="runFreeze()">🔊 3-2-1</button>
        <button class="remind-btn" onclick="speakReminder()">🔊 Reminder</button>
        <div class="reset-counter">
          <span>Resets:</span>
          <span id="resetPill" class="reset-pill" onclick="incrementResets()">0 / 5</span>
        </div>
      </div>
    </header>

    <div class="workspace">
      <main class="stage">
        <section class="banner">
          <div id="actTitle" class="banner-title"></div>
          <div class="obj-row">
            <span class="obj-badge">I Can...</span>
            <span id="actObj" class="obj-text"></span>
          </div>
        </section>

        <section class="cards-grid">
          <!-- CARD 1 -->
          <div id="card-1" class="card">
            <div>
              <div id="c1-title" class="step-pill pill-blue"></div>
              <div id="c1-sub" class="step-sub"></div>
            </div>
            <div id="c1-body" class="card-body"></div>
            <div class="card-timer">
              <div class="timer-top">
                <span id="t1-digits" class="timer-digits">02:00</span>
                <div class="timer-btns">
                  <button class="t-btn t-start" onclick="startCard(1)">▶ Start</button>
                  <button class="t-btn t-pause" onclick="pauseCard(1)">⏸</button>
                  <button class="t-btn t-reset" onclick="resetCard(1)">↺</button>
                  <button class="t-btn t-plus" onclick="addMinCard(1)">+1m</button>
                </div>
              </div>
            </div>
          </div>

          <!-- CARD 2 -->
          <div id="card-2" class="card">
            <div>
              <div id="c2-title" class="step-pill pill-gold"></div>
              <div id="c2-sub" class="step-sub"></div>
            </div>
            <div id="c2-body" class="card-body"></div>
            <div class="card-timer">
              <div class="timer-top">
                <span id="t2-digits" class="timer-digits">06:00</span>
                <div class="timer-btns">
                  <button class="t-btn t-start" onclick="startCard(2)">▶ Start</button>
                  <button class="t-btn t-pause" onclick="pauseCard(2)">⏸</button>
                  <button class="t-btn t-reset" onclick="resetCard(2)">↺</button>
                  <button class="t-btn t-plus" onclick="addMinCard(2)">+1m</button>
                </div>
              </div>
            </div>
          </div>

          <!-- CARD 3 -->
          <div id="card-3" class="card">
            <div>
              <div id="c3-title" class="step-pill pill-green"></div>
              <div id="c3-sub" class="step-sub"></div>
            </div>
            <div id="c3-body" class="card-body"></div>
            <div class="card-timer">
              <div class="timer-top">
                <span id="t3-digits" class="timer-digits">01:00</span>
                <div class="timer-btns">
                  <button class="t-btn t-start" onclick="startCard(3)">▶ Start</button>
                  <button class="t-btn t-pause" onclick="pauseCard(3)">⏸</button>
                  <button class="t-btn t-reset" onclick="resetCard(3)">↺</button>
                </div>
              </div>
              <div class="share-quick">
                <button class="q-btn" onclick="setShareTime(60)">1:00</button>
                <button class="q-btn" onclick="setShareTime(90)">1:30</button>
                <button class="q-btn" onclick="setShareTime(120)">2:00</button>
                <button class="q-btn q-next" onclick="nextAndStartShare()">▶ Next &amp; Time</button>
              </div>
            </div>
          </div>
        </section>
      </main>

      <aside class="roster-panel">
        <div class="panel-title">5M2 Partners &amp; Share Order (23)</div>
        <div id="studentGrid" class="student-grid"></div>
        <div class="panel-actions">
          <button class="act-btn btn-pair" onclick="lockSelectedGroup()">➕ Pair (<span id="pickCount">0</span>)</button>
          <button class="act-btn btn-auto" onclick="autoPairRemaining()">⚡ Auto-Pair</button>
          <button class="act-btn btn-shuffle" onclick="randomizeOrder()">🎲 Random Order</button>
          <button class="act-btn btn-next" onclick="nextPresenter()">▶ Next</button>
          <button class="act-btn btn-clear" onclick="clearAllGroups()">✖ Clear</button>
        </div>
        <div id="groupsList" class="groups-list"></div>
      </aside>
    </div>
  </div>

  <script>
    const STUDENTS_5M2 = [
      "Julia", "Freya", "Anna", "Grace", "Avery", "Yihan", "Emma", "Abigail",
      "Susie", "Nina", "Kenneth", "Dafa", "Jim", "Charles", "Henry", "Patrick",
      "Ryan", "David", "Justin", "Jason M", "Edwin", "Jason S", "Terrance"
    ];

    const ACTIVITIES = {
      mini_account: {
        title: "2-PARTNER MINI CRIME ACCOUNT",
        obj: "Co-write a high-quality crime account with time, day, location, 3 pieces of evidence, 2 suspect descriptions, 2 witnesses with reported speech (no quotes), and a vivid verb!",
        durations: [120, 360, 60],
        labels: ["1. SOLO THINK", "2. PARTNER WRITE", "3. CLASS SHARE"],
        subs: ["Silent Planning", "Knee-to-Knee (Add Initials)", "Per-Group Reading Timer"],
        c1: `<div class="sentence-box">🔍 Pick: <b>Time &amp; Day</b>, <b>Location</b>, <b>3 Evidence Clues</b>, <b>2 Suspect Descriptions</b>, and <b>2 Witnesses</b>.</div><div class="sentence-box">Stay silent and lock in your details first!</div>`,
        c2: `<div class="sentence-box"><b>1) Intro:</b> At <i>[time]</i> on <i>[day]</i>, a ______ went missing from the <i>[location]</i> while ______.</div><div class="sentence-box"><b>2) Evidence (3 Clues):</b> Detective ______ examined the ______ and discovered <i>[clue 1]</i>, <i>[clue 2]</i>, and <i>[clue 3]</i>.</div><div class="sentence-box"><b>3) Witnesses (2) &amp; Suspects (2):</b> Witness 1 said that he/she had seen <i>[suspect 1]</i>... Witness 2 mentioned that <i>[suspect 2]</i>...</div>`,
        c3: `<div class="sentence-box">Read clearly! Listeners hold up:</div><div class="sentence-box" style="background:#0f2547;color:#fff;text-align:center;">☝️ 1 finger = 3 Clues + Time/Place</div><div class="sentence-box" style="background:#047857;color:#fff;text-align:center;">✌️ 2 fingers = 2 Suspects + 2 Witnesses</div>`,
        tts1: "Step 1, Solo Think. Two minutes, completely silent. Pick your time and day, school location, three evidence clues, two suspect descriptions, and two witnesses. Stay silent and lock in your details first.",
        tts2: "Step 2, Partner Write. Six minutes, knee-to-knee. Write your three-part crime account together with three clues, two suspects, and two witnesses using reported speech without quote marks. Speak softly, use English only, and listen carefully to your partner.",
        tts3: "Step 3, Class Share. Class 5M2, quiet down and stay silent. Listen carefully as each pair reads aloud. Hold up one finger for three clues and time and place, and two fingers for two suspects and two witnesses."
      },
      library_deduction: {
        title: "MISSING LIBRARY BOOK DEDUCTION",
        obj: "Evaluate 3+ clues, 2 suspects, and 2 witnesses with reported speech ('mentioned that' + past tense, no quotes) plus time/location to defend your verdict!",
        durations: [120, 360, 60],
        labels: ["1. SOLO THINK", "2. PARTNER PROBE", "3. VERDICT SHARE"],
        subs: ["Silent Clue Scan", "Co-Write Verdict (Add Initials)", "Per-Group Reading Timer"],
        c1: `<div class="sentence-box">🔍 Box <b>[ ]</b> the <b>time, location, 3+ clues, 2 suspects, and 2 witnesses</b>.</div><div class="sentence-box">Write 1 silent inference: <i>"I think Mia took the book [by accident / on purpose] because..."</i></div>`,
        c2: `<div class="sentence-box">Probe: <i>"Which clues &amp; 2 witnesses prove that?"</i></div><div class="sentence-box">Co-write your verdict citing <b>3+ clues</b>, <b>what 2 witnesses said that they had seen</b>, and why the <b>2nd suspect</b> is cleared.</div>`,
        c3: `<div class="sentence-box">Read your verdict aloud!</div><div class="sentence-box">Listeners check: 3+ clues cited? 2 witnesses in Reported Speech (no quotes)? Other suspect cleared?</div>`,
        tts1: "Step 1, Solo Think. Two minutes, completely silent. Box the time, location, three or more clues, two suspects, and two witnesses, and write your silent inference.",
        tts2: "Step 2, Partner Probe. Six minutes. Probe your partner using English only, speak softly, and co-write your verdict citing three or more clues and two witnesses in reported speech without quotation marks.",
        tts3: "Step 3, Verdict Share. Quiet down, stay silent, and listen carefully to each group's verdict."
      },
      when_while_swap: {
        title: "WHEN VS. WHILE CLAUSE INVERSION",
        obj: "Build crime-scene sentences with 3–4 clues, 2–3 suspects, and 2–3 witnesses combining ongoing actions (was/were + -ing) and sudden snaps (Past Simple) with 'when', 'while', and commas!",
        durations: [120, 360, 60],
        labels: ["1. SOLO DRAFT", "2. CONJUNCTION SWAP", "3. SENTENCE SHARE"],
        subs: ["Silent Drafting", "Partner Check & Invent", "Per-Group Reading Timer"],
        c1: `<div class="sentence-box">🎬 Write <b>1 ongoing action</b> (<i>was/were + -ing</i>) + 📸 <b>1 sudden interruption</b> (<i>Past Simple</i>) featuring a suspect, witness, and clue.</div>`,
        c2: `<div class="sentence-box">Swap <b>when ↔ while</b> and check commas!</div><div class="sentence-box">Co-write <b>3 sentences</b> weaving in <b>3–4 clues, 2–3 suspects, and 2–3 witnesses</b>.</div>`,
        c3: `<div class="sentence-box">Read your inverted sentences aloud!</div><div class="sentence-box">Class check: 🎬 = <i>was/were + -ing</i> | 📸 = <i>Past Simple</i> | Comma right?</div>`,
        tts1: "Step 1, Solo Draft. Two minutes, silent. Write one ongoing action with was or were plus i-n-g, and one sudden interruption in the past simple.",
        tts2: "Step 2, Conjunction Swap. Six minutes. Swap when and while with your partner, check your commas, and co-write three sentences with clues, suspects, and witnesses. Speak softly and use English only.",
        tts3: "Step 3, Sentence Share. Quiet down, stay silent, and listen carefully to each pair's sentences."
      },
      alibi_clash: {
        title: "ALIBI CLASH NOVEL SEQUENCE",
        obj: "Match Alibi Clash cards and co-write a 4-sentence Incident Log with time, location, 4 clues/evidence, 3 suspect descriptions, 3 witnesses, and accurate when/while sentences!",
        durations: [120, 360, 60],
        labels: ["1. SOLO CARD READ", "2. ALIBI CLASH", "3. LOG SHARE"],
        subs: ["Silent Card Check", "Match & Write Log", "Per-Group Reading Timer"],
        c1: `<div class="sentence-box">Read your Alibi Clash card silently. Circle <b>suspect/witness</b> and underline the <b>verb tense</b>.</div>`,
        c2: `<div class="sentence-box">Match Card A (🎬 <i>While</i>) + Card B (📸 <i>When</i>).</div><div class="sentence-box">Write <b>4 new Incident Log sentences</b> with <b>time, location, 4 clues, 3 suspects, and 3 witnesses</b> (add initials!).</div>`,
        c3: `<div class="sentence-box">Read your Incident Log aloud!</div><div class="sentence-box">Class check: 4 clues + 3 suspects + 3 witnesses? <i>was/were</i> accurate?</div>`,
        tts1: "Step 1, Solo Card Read. Two minutes, silent. Read your Alibi Clash card, circle the suspect or witness, and underline the verb tense.",
        tts2: "Step 2, Alibi Clash. Six minutes. Match Card A and Card B, then write four new Incident Log sentences with time, location, four clues, three suspects, and three witnesses. Speak softly and use English only.",
        tts3: "Step 3, Log Share. Quiet down, stay silent, and listen carefully as each pair reads their Incident Log."
      },
      red_herring: {
        title: "CLUE VS. RED HERRING CREATION",
        obj: "Evaluate 4+ clues vs. red herrings across 3 suspects and 3 witnesses using logical evidence ('because...') and invent 1 convincing red herring!",
        durations: [120, 360, 60],
        labels: ["1. SOLO SORT", "2. PARTNER DEBATE", "3. HERRING PITCH"],
        subs: ["Silent Decision", "Sort & Invent 1 Red Herring", "Per-Group Reading Timer"],
        c1: `<div class="sentence-box">Read your clue strip silently: <b>True Clue</b> or <b>Red Herring</b>? Write 1 reason why.</div>`,
        c2: `<div class="sentence-box">Sort all strips together across <b>3 suspects &amp; 3 witnesses</b>.</div><div class="sentence-box">Invent <b>1 new red herring</b> with a <b>suspect description &amp; witness quote</b>!</div>`,
        c3: `<div class="sentence-box">Pitch your fake clue to 5M2!</div><div class="sentence-box">Does it sound suspicious at first, with an innocent explanation?</div>`,
        tts1: "Step 1, Solo Sort. Two minutes, silent. Decide if your strip is a true clue or a red herring, and write one reason why.",
        tts2: "Step 2, Partner Debate. Six minutes. Sort all strips together and invent one new red herring with a suspect description and witness quote. Speak softly and use English only.",
        tts3: "Step 3, Herring Pitch. Quiet down, stay silent, and listen carefully to see if you can spot the fake clue."
      },
      suspense_hook: {
        title: "LIBRARY SUSPENSE TRANSFER",
        obj: "Co-write a suspense opening with time, day, location, 4 clues/evidence, 3 suspects, 3 witnesses, '-ed/-ing' feeling adjectives, and 'when/while' sentences!",
        durations: [120, 360, 60],
        labels: ["1. SOLO LOG", "2. SUSPENSE HOOK", "3. HOOK SHARE"],
        subs: ["Silent Reading Log", "Co-Write Suspense Opening", "Per-Group Reading Timer"],
        c1: `<div class="sentence-box">Log <b>1 detective technique</b> and <b>1 suspense detail</b> from your reader silently.</div>`,
        c2: `<div class="sentence-box">Co-write a suspense opening with <b>time, location, 4 clues, 3 suspects, 3 witnesses, 1 feeling adjective</b> (<i>shocked/puzzled</i>), and <b>when/while</b>.</div>`,
        c3: `<div class="sentence-box">Read your suspense opening aloud!</div><div class="sentence-box">Listeners spot the clues, suspects, and feeling adjectives!</div>`,
        tts1: "Step 1, Solo Log. Two minutes, silent. Log one detective technique and one suspense detail from your reader.",
        tts2: "Step 2, Suspense Hook. Six minutes. Co-write a suspense opening with time, location, four clues, three suspects, three witnesses, and a feeling adjective. Speak softly in English only.",
        tts3: "Step 3, Hook Share. Quiet down, stay silent, and listen carefully to each group's suspense opening."
      },
      sentence_upgrade: {
        title: "SENTENCE AUCTION & UPGRADE",
        obj: "Upgrade a bland crime log using vivid verbs, sensory & -ed/-ing adjectives, 4–5 clues, 3–4 suspects, 3–4 witnesses with reported speech, time/location, and consistent past tense!",
        durations: [120, 360, 60],
        labels: ["1. SOLO UPGRADE", "2. PARTNER AUCTION", "3. UPGRADE SHARE"],
        subs: ["Find Weak Verbs", "Embed All 4 Language Tools", "Per-Group Reading Timer"],
        c1: `<div class="sentence-box">Underline <b>2 weak verbs</b> (<i>went, saw, looked</i>) and brainstorm stronger past-tense verbs.</div>`,
        c2: `<div class="sentence-box">Co-write an upgraded paragraph with <b>time, location, 4–5 clues, 3–4 suspects, 3–4 witnesses, vivid verbs, and sensory/-ed/-ing adjectives</b>.</div>`,
        c3: `<div class="sentence-box">Read your upgraded paragraph!</div><div class="sentence-box">Class votes on the most vivid verb and suspense detail!</div>`,
        tts1: "Step 1, Solo Upgrade. Two minutes, silent. Underline two weak verbs and brainstorm stronger past-tense replacements.",
        tts2: "Step 2, Partner Auction. Six minutes. Co-write an upgraded paragraph using vivid verbs, sensory adjectives, clues, suspects, and witnesses. Speak softly and use English only.",
        tts3: "Step 3, Upgrade Share. Quiet down, stay silent, and listen carefully to vote on the most vivid verbs."
      },
      case_blueprint: {
        title: "CASE BLUEPRINT & LOGIC AUDIT",
        obj: "Plan a complete 3-part crime account (time, day, location, when/while, 5+ physical clues, 4 suspect descriptions, 4 witnesses with reported speech, red herring, and twist)!",
        durations: [120, 360, 60],
        labels: ["1. SOLO CLUE", "2. BLUEPRINT & AUDIT", "3. AUDIT SHARE"],
        subs: ["Silent Brainstorm", "Plan & Logic Check", "Per-Group Reading Timer"],
        c1: `<div class="sentence-box">Silently plan: <b>Time/Day/Place</b>, <b>2 Physical Clues</b>, and <b>2 Suspect Descriptions</b>.</div>`,
        c2: `<div class="sentence-box">Complete your 3-part outline with <b>5+ clues + 4 suspects + 4 witnesses (reported speech) + 1 red herring + when/while</b>, then swap for a Logic Audit!</div>`,
        c3: `<div class="sentence-box">Share 1 logic fix your partner caught!</div><div class="sentence-box">Check: Do all 5+ clues point logically to the real culprit?</div>`,
        tts1: "Step 1, Solo Clue. Two minutes, silent. Plan your time, day, place, two physical clues, and two suspect descriptions.",
        tts2: "Step 2, Blueprint and Audit. Six minutes. Complete your three-part outline with five or more clues, four suspects, four witnesses, and a red herring, then check your partner's logic. Speak softly and use English only.",
        tts3: "Step 3, Audit Share. Quiet down, stay silent, and listen carefully to each group's logic check."
      }
    };

    let currentActivityKey = 'mini_account';
    const cardState = {
      1: { duration: 120, remaining: 120, id: null },
      2: { duration: 360, remaining: 360, id: null },
      3: { duration: 60, remaining: 60, id: null }
    };
    let freezeId = null;
    let freezeRem = 5;
    let cleanResets = 0;
    let picking = [];
    let groups = [];
    let activeGroupIdx = -1;
    let emmaVoice = null;
    let periodicReminderId = null;

    function loadEmmaVoice() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return;
      emmaVoice =
        voices.find(v => /microsoft.*emma.*online.*natural|microsoft.*emma.*multilingual|emma.*multilingual/i.test(v.name) && /^en/i.test(v.lang)) ||
        voices.find(v => /microsoft.*aria.*online.*natural|microsoft.*aria.*multilingual|aria.*multilingual/i.test(v.name) && /^en/i.test(v.lang)) ||
        voices.find(v => /microsoft.*online.*natural|multilingual.*online.*natural/i.test(v.name) && /^en/i.test(v.lang)) ||
        voices.find(v => /^en/i.test(v.lang) && /emma|aria|jenny|zira|susan|female/i.test(v.name)) ||
        voices.find(v => /^en/i.test(v.lang)) ||
        voices[0];
    }

    if ('speechSynthesis' in window) {
      loadEmmaVoice();
      window.speechSynthesis.onvoiceschanged = loadEmmaVoice;
    }

    function speakEmma(text, interrupt = true, onEnd = null) {
      if (!('speechSynthesis' in window)) {
        if (onEnd) onEnd();
        return;
      }
      loadEmmaVoice();
      const synth = window.speechSynthesis;
      if (interrupt) synth.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = 0.96;
      utter.pitch = 1.06;
      utter.volume = 1.0;
      if (emmaVoice) {
        utter.voice = emmaVoice;
        if (/^en/i.test(emmaVoice.lang)) utter.lang = emmaVoice.lang;
      }
      let done = false;
      const finish = () => { if (!done) { done = true; if (onEnd) onEnd(); } };
      utter.onend = finish;
      utter.onerror = finish;
      try { synth.resume(); } catch (e) {}
      synth.speak(utter);
    }

    function speakBoysReminder() {
      speakEmma("Justin, Yihan, Charles, and Kenneth, listen quietly and speak English softly.", true);
    }

    function speakReminder() {
      speakEmma("Class 5M2, quiet down and stay silent for a moment. Remember to use English only, speak softly, and listen carefully to your partner.", true);
    }

    function formatTime(sec) {
      return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
    }

    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [523.25, 659.25, 783.99].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.18, ctx.currentTime + i * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.14 + 0.45);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.14);
          osc.stop(ctx.currentTime + i * 0.14 + 0.5);
        });
      } catch (e) {}
    }

    function playBell(durationSec = 1.0) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        [1046.5, 2093.0, 2637.0, 3136.0].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const amp = idx === 0 ? 0.28 : 0.14 / idx;
          gain.gain.setValueAtTime(amp, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + durationSec);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + durationSec + 0.05);
        });
      } catch (e) {}
    }

    function updateCardDisplay(n) {
      const st = cardState[n];
      const el = document.getElementById(`t${n}-digits`);
      el.textContent = formatTime(st.remaining);
      el.classList.remove('warning', 'done');
      if (st.remaining === 0) el.classList.add('done');
      else if (st.remaining <= 10) el.classList.add('warning');
    }

    function pauseAllCards(except = 0) {
      [1, 2, 3].forEach(n => {
        if (n !== except && cardState[n].id !== null) {
          clearInterval(cardState[n].id);
          cardState[n].id = null;
        }
        document.getElementById(`card-${n}`).classList.toggle('active-card', n === except);
      });
      if (periodicReminderId !== null) {
        clearInterval(periodicReminderId);
        periodicReminderId = null;
      }
    }

    function startCard(n, skipTts = false) {
      pauseAllCards(n);
      const st = cardState[n];
      if (st.id !== null) return;
      if (st.remaining === 0) st.remaining = st.duration;
      updateCardDisplay(n);

      if (!skipTts) {
        const act = ACTIVITIES[currentActivityKey];
        if (n === 1) speakEmma(act.tts1, true);
        else if (n === 2) speakEmma(act.tts2, true);
        else if (n === 3) speakEmma(act.tts3, true);
      }

      if (n === 2) {
        periodicReminderId = setInterval(() => {
          speakEmma("Reminder, 5M2: speak softly, use English only, and listen carefully to your partner.", false);
        }, 120000);
      }

      st.id = setInterval(() => {
        if (st.remaining > 0) {
          st.remaining--;
          updateCardDisplay(n);
          if (st.remaining === 0) {
            clearInterval(st.id);
            st.id = null;
            if (periodicReminderId !== null) { clearInterval(periodicReminderId); periodicReminderId = null; }
            playChime();
            if (n === 1) speakEmma("Time is up for Solo Think! Eyes on me in three, two, one.", true);
            else if (n === 2) speakEmma("Time is up for Partner Write! Pencils down, eyes on me in three, two, one.", true);
            else if (n === 3) speakEmma("Time is up! Thank you for listening carefully.", true);
          }
        }
      }, 1000);
    }

    function pauseCard(n) {
      if (cardState[n].id !== null) {
        clearInterval(cardState[n].id);
        cardState[n].id = null;
      }
      if (periodicReminderId !== null) { clearInterval(periodicReminderId); periodicReminderId = null; }
    }

    function resetCard(n) {
      pauseCard(n);
      cardState[n].remaining = cardState[n].duration;
      updateCardDisplay(n);
    }

    function addMinCard(n) {
      cardState[n].remaining += 60;
      updateCardDisplay(n);
    }

    function setShareTime(sec) {
      pauseCard(3);
      cardState[3].duration = sec;
      cardState[3].remaining = sec;
      updateCardDisplay(3);
    }

    function announcePresenter(idx) {
      if (idx < 0 || !groups[idx]) return;
      const names = groups[idx].names;
      const spokenNames = names.length === 3
        ? `${names[0]}, ${names[1]}, and ${names[2]}`
        : names.join(' and ');
      speakEmma(`Class 5M2, quiet down and stay silent. Listen carefully and use English only. Up next to share: ${spokenNames}! Speak clearly and listen carefully.`, true);
    }

    function nextAndStartShare() {
      if (groups.length === 0) randomizeOrder(false);
      else nextPresenter(false);
      resetCard(3);
      announcePresenter(activeGroupIdx);
      startCard(3, true);
    }

    let freezeActive = false;
    function runFreeze() {
      const btn = document.getElementById('freezeBtn');
      if (freezeActive) {
        if (freezeId !== null) { clearInterval(freezeId); freezeId = null; }
        freezeActive = false;
        freezeRem = 5;
        btn.classList.remove('running');
        btn.textContent = '🔊 3-2-1';
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        return;
      }
      freezeActive = true;
      freezeRem = 5;
      btn.classList.add('running');
      btn.textContent = `3-2-1: 0:0${freezeRem}`;

      let speechDone = false;
      let timerDone = false;
      const maybeFinishFreeze = () => {
        if (!freezeActive || !speechDone || !timerDone) return;
        speakEmma("Very good, Emma, Julia, and Freya! You are always very good—you will get Dojo points and Praise Cards!", false, () => {
          if (freezeActive) playBell(1.0);
          freezeActive = false;
          btn.classList.remove('running');
          btn.textContent = '🔊 3-2-1';
        });
      };

      speakEmma("Three, pencils down. Two, hands empty. One, eyes on me, zero voice.", true, () => {
        speechDone = true;
        maybeFinishFreeze();
      });

      freezeId = setInterval(() => {
        freezeRem--;
        if (freezeRem > 0) {
          btn.textContent = `3-2-1: 0:0${freezeRem}`;
        } else {
          clearInterval(freezeId);
          freezeId = null;
          timerDone = true;
          btn.textContent = '3-2-1...';
          maybeFinishFreeze();
        }
      }, 1000);
    }

    function incrementResets() {
      cleanResets = (cleanResets + 1) % 6;
      document.getElementById('resetPill').textContent = cleanResets + ' / 5';
    }

    function loadActivity(key) {
      currentActivityKey = key;
      const a = ACTIVITIES[key];
      document.getElementById('actTitle').textContent = a.title;
      document.getElementById('actObj').textContent = a.obj;
      document.getElementById('c1-title').textContent = a.labels[0];
      document.getElementById('c2-title').textContent = a.labels[1];
      document.getElementById('c3-title').textContent = a.labels[2];
      document.getElementById('c1-sub').textContent = a.subs[0];
      document.getElementById('c2-sub').textContent = a.subs[1];
      document.getElementById('c3-sub').textContent = a.subs[2];
      document.getElementById('c1-body').innerHTML = a.c1;
      document.getElementById('c2-body').innerHTML = a.c2;
      document.getElementById('c3-body').innerHTML = a.c3;

      pauseAllCards(1);
      [1, 2, 3].forEach((n, idx) => {
        cardState[n].duration = a.durations[idx];
        cardState[n].remaining = a.durations[idx];
        updateCardDisplay(n);
      });
    }

    function getGroupedSet() {
      const s = new Set();
      groups.forEach(g => g.names.forEach(n => s.add(n)));
      return s;
    }

    function renderRoster() {
      const grouped = getGroupedSet();
      const grid = document.getElementById('studentGrid');
      grid.innerHTML = '';
      STUDENTS_5M2.forEach(name => {
        const btn = document.createElement('button');
        btn.type = 'button';
        const isGrouped = grouped.has(name);
        const isPicking = picking.includes(name);
        btn.className = 'stu-chip' + (isPicking ? ' picking' : (isGrouped ? ' grouped' : ''));
        btn.textContent = name;
        btn.disabled = isGrouped;
        btn.onclick = () => {
          if (picking.includes(name)) picking = picking.filter(n => n !== name);
          else if (picking.length < 3) picking.push(name);
          renderRoster();
        };
        grid.appendChild(btn);
      });
      document.getElementById('pickCount').textContent = picking.length;
    }

    function lockSelectedGroup() {
      if (picking.length < 2) return;
      groups.push({ names: [...picking], pts: 0 });
      picking = [];
      activeGroupIdx = -1;
      renderRoster();
      renderGroups();
    }

    function autoPairRemaining() {
      const grouped = getGroupedSet();
      const remainingStudents = STUDENTS_5M2.filter(n => !grouped.has(n) && !picking.includes(n));
      if (picking.length >= 2) { groups.push({ names: [...picking], pts: 0 }); picking = []; }
      else if (picking.length === 1) { remainingStudents.unshift(picking[0]); picking = []; }
      const shuffled = [...remainingStudents].sort(() => Math.random() - 0.5);
      for (let i = 0; i < shuffled.length; i += 2) {
        if (shuffled.length - i === 3) { groups.push({ names: [shuffled[i], shuffled[i+1], shuffled[i+2]], pts: 0 }); break; }
        else if (shuffled.length - i === 1 && groups.length > 0) { groups[groups.length - 1].names.push(shuffled[i]); }
        else { groups.push({ names: shuffled.slice(i, i + 2), pts: 0 }); }
      }
      activeGroupIdx = -1;
      renderRoster();
      renderGroups();
    }

    function addGroupPoints(idx) {
      if (groups[idx]) {
        groups[idx].pts += 1;
        renderGroups();
      }
    }

    function randomizeOrder(speak = true) {
      if (groups.length === 0) autoPairRemaining();
      groups = [...groups].sort(() => Math.random() - 0.5);
      activeGroupIdx = 0;
      renderGroups();
      if (speak) announcePresenter(activeGroupIdx);
    }

    function nextPresenter(speak = true) {
      if (groups.length === 0) return;
      activeGroupIdx = (activeGroupIdx + 1) % groups.length;
      renderGroups();
      if (speak) announcePresenter(activeGroupIdx);
    }

    function removeGroup(idx) {
      groups.splice(idx, 1);
      if (activeGroupIdx >= groups.length) activeGroupIdx = groups.length - 1;
      renderRoster();
      renderGroups();
    }

    function clearAllGroups() {
      picking = [];
      groups = [];
      activeGroupIdx = -1;
      renderRoster();
      renderGroups();
    }

    function renderGroups() {
      const list = document.getElementById('groupsList');
      if (groups.length === 0) {
        list.innerHTML = `<div style="text-align:center;color:#64748b;font-weight:700;padding:16px 6px;font-size:0.74rem;">Click 2–3 names above to pair, or click <b>⚡ Auto-Pair</b> for all 23 students!</div>`;
        return;
      }
      list.innerHTML = groups.map((g, idx) => `
        <div class="group-card ${idx === activeGroupIdx ? 'presenting' : ''}">
          <span class="group-order">#${idx + 1}</span>
          <span class="group-names">${g.names.join(' &amp; ')}</span>
          <button class="group-pts" onclick="addGroupPoints(${idx})" title="Click to add +1 point">+1 Pt (${g.pts})</button>
          <button class="group-remove" onclick="removeGroup(${idx})" title="Remove group">✕</button>
        </div>
      `).join('');
    }

    loadActivity('mini_account');
    renderRoster();
    renderGroups();
  </script>
